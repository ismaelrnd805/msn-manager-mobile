name: msn_desktop
description: "MSN Manager V1 — application Windows (un compte appareil Windows, spéc. §3)."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  msn_core:
    path: ../../packages/core
  msn_ui:
    path: ../../packages/msn_ui
  # Bundler SQLite natif pour NativeDatabase (msn_core) sur Windows.
  sqlite3_flutter_libs: ^0.5.42
  # Dimensionnement de fenêtre desktop uniquement.
  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
