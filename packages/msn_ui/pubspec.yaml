name: msn_ui
description: "MSN Manager V1 — interface partagée (écrans, shell adaptatif, providers Riverpod). Consommée par apps/mobile (Android) et apps/desktop (Windows)."
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  msn_core:
    path: ../core
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  drift: ^2.20.0
  uuid: ^4.4.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
