name: msn_manager
version: 1.0.0+1
description: MSN Manager - gestion client, commandes et workflows pour Multi-Services Numériques.
publish_to: "none"
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  intl: ^0.19.0
  file_picker: ^8.3.7
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  http: ^1.5.0
  crypto: ^3.0.6
  flutter_blue_plus: ^1.35.5
  permission_handler: ^12.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/data/
