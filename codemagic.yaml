workflows:
  android-debug:
    name: MSN Manager Android Debug
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "mg.msn.manager"
    scripts:
      - name: Ensure Android platform
        script: flutter create . --platforms=android --org mg.msn --project-name msn_manager
      - name: Restore Android permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          perms="""\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />\n"""
          if "BLUETOOTH_SCAN" not in s: s=s.replace("<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">", "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">"+perms)
          if "<queries>" not in s: s=s.replace("</manifest>", "<queries><intent><action android:name=\"android.intent.action.VIEW\"/><data android:scheme=\"whatsapp\"/></intent><intent><action android:name=\"android.intent.action.VIEW\"/><data android:scheme=\"fb-messenger\"/></intent></queries></manifest>")
          p.write_text(s)
          PY
      - name: Flutter pub get
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Unit/widget tests
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  android-release:
    name: MSN Manager Android Release AAB
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "mg.msn.manager"
    scripts:
      - name: Ensure Android platform
        script: flutter create . --platforms=android --org mg.msn --project-name msn_manager
      - name: Restore Android permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          perms="""\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />\n"""
          if "BLUETOOTH_SCAN" not in s: s=s.replace("<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">", "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">"+perms)
          if "<queries>" not in s: s=s.replace("</manifest>", "<queries><intent><action android:name=\"android.intent.action.VIEW\"/><data android:scheme=\"whatsapp\"/></intent><intent><action android:name=\"android.intent.action.VIEW\"/><data android:scheme=\"fb-messenger\"/></intent></queries></manifest>")
          p.write_text(s)
          PY
      - name: Flutter pub get
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Unit/widget tests
        script: flutter test
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
