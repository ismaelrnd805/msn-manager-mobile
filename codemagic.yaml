# Codemagic CI/CD — MSN Manager V1
# Deux workflows séparés, deux machines distinctes :
#   * android-mobile  → APK release (machine macOS)
#   * windows-desktop → EXE Windows + ZIP (machine Windows)
# Les dossiers de plateforme (android/, windows/) sont générés par `flutter create`
# au moment du build : le dépôt reste léger et toujours aligné sur le SDK Flutter
# utilisé par la CI. Guide complet : docs/08-codemagic.md
workflows:
  android-mobile:
    name: MSN Manager — Android (APK release)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.35.4
      # Groupe de variables OPTIONNEL pour la signature de production :
      # msn_android_signing = CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD,
      #                       CM_KEY_ALIAS, CM_KEY_ALIAS_PASSWORD
      # Sans keystore, l'APK est signé debug (installable pour tests).
      groups:
        - msn_android_signing
    scripts:
      - name: Tests du cœur métier (msn_core)
        script: |
          cd packages/core
          dart test
      - name: Génération + configuration de la plateforme Android
        script: bash scripts/ci/android_prepare.sh
      - name: Build APK release
        script: |
          cd apps/mobile
          flutter build apk --release
      - name: Signature production (si keystore fourni)
        script: bash scripts/ci/android_sign.sh
    artifacts:
      - apps/mobile/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - vous@votre-domaine.mg
        notify:
          success: true
          failure: true

  windows-desktop:
    name: MSN Manager — Windows (EXE release)
    instance_type: windows_x2
    max_build_duration: 60
    environment:
      flutter: 3.35.4
    scripts:
      # Sur les machines Windows Codemagic, les scripts s'exécutent en PowerShell.
      - name: Génération de la plateforme Windows
        script: |
          cd apps/desktop
          if (-not (Test-Path windows)) {
            flutter create . --platforms windows --project-name msn_desktop
          }
          flutter pub get
      - name: Build Windows release
        script: |
          cd apps/desktop
          flutter build windows --release
      - name: Empaquetage ZIP (exe + DLL)
        script: |
          cd apps/desktop
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath dist/MSN_Manager_Windows.zip -Force
    artifacts:
      - apps/desktop/dist/*.zip
    publishing:
      email:
        recipients:
          - vous@votre-domaine.mg
        notify:
          success: true
          failure: true
