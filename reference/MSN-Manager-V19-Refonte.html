<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a7c6f">
<title>MSN Manager — V19 Refonte</title>
<style>
/* ============================================================
   DESIGN SYSTEM V19 — Soft clair premium · WCAG AA
   Palette : crème chaud / sauge / terracotta
   ============================================================ */
:root{
  --bg:#f6f4ee;
  --surface:#ffffff;
  --surface-2:#fbf9f5;
  --surface-3:#f2efe7;
  --border:#e8e3d8;
  --border-strong:#d8d1c2;

  --text:#2b2925;
  --text-2:#5c584f;
  --text-3:#757063;

  --primary:#4a7c6f;
  --primary-strong:#3a6457;
  --primary-soft:#e5efe9;
  --primary-softer:#f0f5f1;

  --accent:#b5673a;
  --accent-strong:#9a5530;
  --accent-soft:#f6e8dd;

  --success:#3d8265;   --success-soft:#e0efe7;  --success-text:#275f49;
  --warning:#a97d24;   --warning-soft:#f5ecd6;  --warning-text:#7d5b12;
  --danger:#bb5a4c;    --danger-soft:#f8e5e1;   --danger-text:#96413a;
  --info:#4a7d9d;      --info-soft:#e1eef5;     --info-text:#38617d;

  --radius:20px;
  --radius-sm:14px;
  --radius-lg:26px;
  --radius-full:999px;

  --shadow-xs:0 1px 2px rgba(43,41,37,.05);
  --shadow-sm:0 2px 8px rgba(43,41,37,.06);
  --shadow:0 6px 20px rgba(43,41,37,.08);
  --shadow-lg:0 18px 44px rgba(43,41,37,.16);

  --nav-h:66px;
  --header-h:60px;
  --safe-b:env(safe-area-inset-bottom, 0px);

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ring:0 0 0 2.5px var(--surface),0 0 0 5px rgba(74,124,111,.5);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  font-family:var(--font);
  background:#efece4;
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;padding:0;}
a{color:inherit;text-decoration:none;}
ul,ol{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4{margin:0;font-weight:680;letter-spacing:-.012em;line-height:1.3;}
p{margin:0;}

/* ---------- Accessibilité transversale ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.skip-link{
  position:fixed;top:-60px;left:12px;z-index:999;
  background:var(--primary-strong);color:#fff;font-weight:700;
  padding:10px 16px;border-radius:12px;transition:top .15s;
}
.skip-link:focus{top:12px;}
:focus-visible{outline:3px solid rgba(74,124,111,.55);outline-offset:2px;border-radius:6px;}
.btn:focus-visible,.icon-btn:focus-visible,.nav-item:focus-visible,.chip:focus-visible,.tab:focus-visible{box-shadow:var(--ring);outline:none;}
[role="button"]{cursor:pointer;}
[role="button"]:focus-visible{box-shadow:var(--ring);outline:none;}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{
  animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important;scroll-behavior:auto!important;
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
}

/* ---------- App frame (mobile-first, centré sur desktop) ---------- */
#app{
  max-width:460px;
  margin:0 auto;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:var(--bg);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 60px rgba(43,41,37,.1);
}
@media(min-width:900px){
  body{background:
    radial-gradient(1200px 600px at 15% -10%,#f3efe6 0%,transparent 60%),
    radial-gradient(900px 500px at 110% 110%,#e9efe9 0%,transparent 55%),
    #eae6dc;
    padding:24px 0;}
  #app{
    height:calc(100vh - 48px);
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 30px 90px rgba(43,41,37,.2);
  }
}

/* ---------- Layout ---------- */
.screen{display:flex;flex-direction:column;flex:1;min-height:0;height:100%;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 10px);}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(43,41,37,.30) transparent;}
.pad{padding:0 18px;}
.pad-y{padding-top:16px;padding-bottom:16px;}
.stack{display:flex;flex-direction:column;gap:12px;}
.row{display:flex;align-items:center;gap:10px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.grow{flex:1;min-width:0;}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}

/* ---------- App bar ---------- */
.appbar{
  position:sticky;top:0;z-index:30;
  background:rgba(246,244,238,.9);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--border);
  padding:11px 18px;
  display:flex;align-items:center;gap:10px;
  min-height:var(--header-h);
}
.appbar h1{font-size:17px;font-weight:720;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.appbar .sub{font-size:12px;color:var(--text-2);font-weight:520;display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.icon-btn{
  width:42px;height:42px;border-radius:13px;
  display:grid;place-items:center;
  color:var(--text-2);
  background:var(--surface);
  border:1px solid var(--border);
  transition:transform .12s, background .15s;
  flex:0 0 auto;
  position:relative;
}
.icon-btn:active{transform:scale(.94);}
.icon-btn.ghost{background:transparent;border-color:transparent;}
.icon-btn .dot{
  position:absolute;top:7px;right:7px;
  width:9px;height:9px;border-radius:50%;
  background:var(--danger);border:2px solid var(--surface);
}

/* ---------- Brand ---------- */
.brand{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(140deg,var(--primary) 0%,var(--primary-strong) 100%);
  color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:14px;letter-spacing:-.02em;
  box-shadow:0 6px 16px rgba(74,124,111,.32);
  flex:0 0 auto;
}
.brand.sm{width:36px;height:36px;border-radius:12px;font-size:12px;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;
  bottom:0;left:0;right:0;
  max-width:460px;margin:0 auto;
  background:rgba(255,255,255,.97);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:6px 6px calc(6px + var(--safe-b));
  z-index:40;
}
@media(min-width:900px){.bottomnav{bottom:24px;border-radius:0 0 30px 30px;}}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px;border-radius:14px;
  color:var(--text-3);
  font-size:10.5px;font-weight:640;letter-spacing:-.005em;
  transition:color .15s, background .15s;
  position:relative;
  min-height:52px;
}
.nav-item .nav-badge{
  position:absolute;top:3px;right:calc(50% - 20px);
  min-width:16px;height:16px;border-radius:99px;
  background:var(--accent);color:#fff;
  font-size:9.5px;font-weight:800;
  display:grid;place-items:center;padding:0 4px;
  border:2px solid var(--surface);
}
.nav-item.active{color:var(--primary-strong);background:var(--primary-soft);}
.nav-item:active{background:var(--surface-3);}
.nav-item span{line-height:1;}

/* ---------- FAB ---------- */
.fab{
  position:fixed;
  right:calc(50% - 230px + 16px);
  bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  width:56px;height:56px;border-radius:19px;
  background:linear-gradient(140deg,var(--accent) 0%,var(--accent-strong) 100%);
  color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 26px rgba(181,103,58,.42);
  z-index:39;
  transition:transform .15s;
}
@media(max-width:900px){.fab{right:16px;}}
.fab:active{transform:scale(.92);}

/* ---------- Cartes ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow-xs);
}
.card.tight{padding:12px;}
.card.soft{background:var(--surface-2);box-shadow:none;}
.card.sage{background:var(--primary-softer);border-color:transparent;}
.card.cream{background:var(--surface-2);}
[role="button"].card,button.card{transition:transform .12s, box-shadow .15s, border-color .15s;width:100%;text-align:left;}
[role="button"].card:active,button.card:active{transform:scale(.988);}

/* ---------- En-tête de section ---------- */
.sec-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:0 0 10px;gap:10px;
}
.sec-head h2{font-size:15.5px;font-weight:700;}
.sec-head .link{font-size:13px;color:var(--primary-strong);font-weight:650;background:none;}
.eyebrow{
  display:block;font-size:10.5px;letter-spacing:.12em;font-weight:800;
  color:var(--text-3);text-transform:uppercase;margin-bottom:3px;
}

/* ---------- Boutons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:46px;padding:0 18px;border-radius:14px;
  font-weight:650;font-size:14.5px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  transition:transform .12s, background .15s, opacity .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--primary-strong);border-color:var(--primary-strong);color:#fff;box-shadow:0 4px 14px rgba(58,100,87,.3);}
.btn.primary:active{background:var(--primary);}
.btn.accent{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff;box-shadow:0 4px 14px rgba(154,85,48,.3);}
.btn.success{background:var(--success-text);border-color:var(--success-text);color:#fff;}
.btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger-text);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--primary-strong);}
.btn.soft{background:var(--surface-3);border-color:transparent;color:var(--text);}
.btn.sage{background:var(--primary-soft);border-color:transparent;color:var(--primary-strong);}
.btn.block{width:100%;}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:12px;}
.btn.xs{height:32px;padding:0 11px;font-size:12.5px;border-radius:10px;font-weight:620;}
.btn[disabled]{opacity:.45;pointer-events:none;}

/* ---------- Chips / filtres ---------- */
.chips{
  display:flex;gap:8px;overflow-x:auto;
  padding:2px 18px 10px;margin:0 -18px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;
  height:38px;padding:0 15px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);font-size:13px;font-weight:620;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .15s;
}
.chip[aria-pressed="true"],.chip.active{background:var(--text);color:#fff;border-color:var(--text);}
.chip .count{
  background:rgba(255,255,255,.24);border-radius:999px;
  padding:1px 7px;font-size:10.5px;font-weight:750;
}
.chip:not(.active) .count{background:var(--surface-3);color:var(--text-2);}

/* ---------- Badges (jamais par la couleur seule : point + libellé) ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  height:24px;padding:0 10px;border-radius:999px;
  font-size:11.5px;font-weight:680;letter-spacing:.005em;
  white-space:nowrap;
}
.badge::before{
  content:"";width:6px;height:6px;border-radius:50%;
  background:currentColor;flex:0 0 auto;
}
.b-primary{background:var(--primary-soft);color:var(--primary-strong);}
.b-success{background:var(--success-soft);color:var(--success-text);}
.b-warn{background:var(--warning-soft);color:var(--warning-text);}
.b-danger{background:var(--danger-soft);color:var(--danger-text);}
.b-info{background:var(--info-soft);color:var(--info-text);}
.b-muted{background:var(--surface-3);color:var(--text-2);}

/* ---------- Item de priorité ---------- */
.priority{
  display:flex;gap:12px;align-items:flex-start;
  padding:13px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow-xs);
  cursor:pointer;transition:transform .12s, border-color .15s;
  width:100%;text-align:left;
}
.priority:active{transform:scale(.99);}
.priority .p-ico{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;
  display:grid;place-items:center;
}
.priority .p-title{font-size:14px;font-weight:650;line-height:1.3;}
.priority .p-meta{font-size:12px;color:var(--text-2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* ---------- Item de liste ---------- */
.list-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 15px;background:var(--surface);
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .12s;
  width:100%;text-align:left;
  min-height:56px;
}
.list-item:last-child{border-bottom:none;}
.list-item:active{background:var(--surface-2);}
.list-item .li-ico{
  width:40px;height:40px;border-radius:13px;
  display:grid;place-items:center;flex:0 0 auto;
}
.list-item .li-title{font-size:14px;font-weight:640;}
.list-item .li-sub{font-size:12px;color:var(--text-2);margin-top:1px;}
.list-group{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-xs);
}

/* ---------- Avatar ---------- */
.avatar{
  width:42px;height:42px;border-radius:14px;
  display:grid;place-items:center;
  font-weight:750;font-size:14px;color:#fff;flex:0 0 auto;
  letter-spacing:-.02em;
}
.avatar.sm{width:34px;height:34px;border-radius:11px;font-size:12px;}
.avatar.lg{width:58px;height:58px;border-radius:18px;font-size:20px;}

/* ---------- Progression ---------- */
.progress{
  height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;
}
.progress > i{
  display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--primary),var(--primary-strong));
  transition:width .4s ease;
}
.progress.sm{height:5px;}

/* ---------- Timeline (parcours lié) ---------- */
.timeline{position:relative;padding-left:30px;}
.timeline::before{
  content:"";position:absolute;left:10px;top:8px;bottom:8px;
  width:2px;background:var(--border-strong);
}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{
  position:absolute;left:-30px;top:2px;
  width:22px;height:22px;border-radius:50%;
  background:var(--surface);border:2px solid var(--border-strong);
  display:grid;place-items:center;
  color:var(--text-3);
}
.tl-item.done .tl-dot{background:var(--success);border-color:var(--success);color:#fff;}
.tl-item.current .tl-dot{background:var(--primary-strong);border-color:var(--primary-strong);color:#fff;box-shadow:0 0 0 4px var(--primary-soft);}
.tl-item.todo .tl-dot{opacity:.75;}
.tl-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tl-title{font-size:13.5px;font-weight:660;}
.tl-item.todo .tl-title{color:var(--text-3);font-weight:560;}
.tl-meta{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.45;}
.tl-link{font-size:12.5px;font-weight:650;color:var(--primary-strong);margin-top:5px;display:inline-flex;align-items:center;gap:5px;}

/* ---------- Bandeau de parcours lié (journey strip) ---------- */
.journey{
  display:flex;align-items:center;gap:4px;
  overflow-x:auto;padding:4px 2px;
  scrollbar-width:none;
}
.journey::-webkit-scrollbar{display:none;}
.j-step{
  flex:0 0 auto;
  display:flex;align-items:center;gap:6px;
  background:none;border:none;padding:4px;
  border-radius:12px;
}
.j-dot{
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--surface-3);color:var(--text-3);
  border:1.5px solid var(--border);
  flex:0 0 auto;
}
.j-label{font-size:11px;font-weight:680;color:var(--text-2);white-space:nowrap;}
.j-step.done .j-dot{background:var(--success-soft);border-color:transparent;color:var(--success-text);}
.j-step.done .j-label{color:var(--success-text);}
.j-step.current .j-dot{background:var(--primary-strong);border-color:var(--primary-strong);color:#fff;box-shadow:0 0 0 4px var(--primary-soft);}
.j-step.current .j-label{color:var(--primary-strong);}
.j-arrow{color:var(--border-strong);flex:0 0 auto;display:grid;place-items:center;}

/* ---------- Pipeline (dashboard) ---------- */
.pipe{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;}
.pipe::-webkit-scrollbar{display:none;}
.pipe-item{
  flex:0 0 auto;min-width:104px;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:12px 13px;
  text-align:left;box-shadow:var(--shadow-xs);
  transition:transform .12s, border-color .15s;
}
.pipe-item:active{transform:scale(.97);}
.pipe-item.alert{border-color:rgba(181,103,58,.4);background:linear-gradient(160deg,#fff,var(--accent-soft));}
.pipe-item .pipe-num{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.pipe-item .pipe-lbl{font-size:11.5px;font-weight:680;color:var(--text-2);line-height:1.2;}
.pipe-item .pipe-sub{font-size:10.5px;color:var(--text-3);line-height:1.2;}
.pipe-item .pipe-ico{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;}

/* ---------- Stepper (accueil client guidé) ---------- */
.wiz-progress{display:flex;gap:7px;align-items:center;margin:2px 0 14px;}
.wiz-seg{flex:1;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;transition:background .2s;}
.wiz-seg.on{background:var(--primary-strong);}
.wiz-count{font-size:11.5px;font-weight:750;color:var(--text-2);white-space:nowrap;}
.wiz-nav{display:flex;gap:9px;margin-top:16px;}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.choice{padding:14px;border:1.5px solid var(--border);border-radius:15px;background:var(--surface);text-align:left;transition:all .15s;}
.choice.on,.choice.selected{border-color:var(--primary-strong);background:var(--primary-softer);box-shadow:0 0 0 3px var(--primary-soft);}

/* ---------- Formulaire ---------- */
.field{margin-bottom:15px;}
.field label, .field .field-label{
  display:block;font-size:13px;font-weight:660;color:var(--text-2);
  margin-bottom:6px;
}
.field label .req, .field-label .req{color:var(--danger-text);margin-left:2px;}
.input,.select,.textarea{
  width:100%;height:48px;padding:0 14px;
  border-radius:14px;border:1.5px solid var(--border-strong);
  background:var(--surface);font-size:15px;color:var(--text);
  transition:border-color .15s, box-shadow .15s;
  outline:none;
}
.textarea{height:auto;padding:12px 14px;min-height:100px;resize:vertical;line-height:1.55;}
.input:focus,.select:focus,.textarea:focus{
  border-color:var(--primary-strong);box-shadow:0 0 0 3.5px var(--primary-soft);
}
.input[aria-invalid="true"],.select[aria-invalid="true"],.textarea[aria-invalid="true"]{
  border-color:var(--danger);box-shadow:0 0 0 3.5px var(--danger-soft);
}
.field .hint{font-size:12px;color:var(--text-2);margin-top:5px;}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23757063' stroke-width='2' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px;}

.check{
  display:flex;align-items:center;gap:10px;padding:12px 13px;
  border-radius:13px;border:1.5px solid var(--border);background:var(--surface);
  cursor:pointer;font-size:13.5px;font-weight:560;
  transition:all .15s;text-align:left;width:100%;
}
.check.on{border-color:var(--primary-strong);background:var(--primary-softer);}

/* ---------- Segmented ---------- */
.segmented{display:flex;background:var(--surface-3);border-radius:13px;padding:3px;gap:2px;}
.segmented button{flex:1;height:38px;border-radius:10px;font-size:13px;font-weight:640;color:var(--text-2);transition:all .15s;min-height:38px;}
.segmented button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-xs);}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 18px;margin:0 -18px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;padding:12px;font-size:13.5px;font-weight:640;
  color:var(--text-2);border-bottom:2.5px solid transparent;
  transition:all .15s;white-space:nowrap;min-height:46px;
}
.tab[aria-selected="true"],.tab.on{color:var(--primary-strong);border-color:var(--primary-strong);}

/* ---------- Modale (focus piégé, accessible) ---------- */
.modal-back{
  position:fixed;inset:0;z-index:100;
  background:rgba(43,41,37,.48);
  backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .18s ease;
  padding:0;
}
@media(min-width:900px){.modal-back{align-items:center;}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(26px);opacity:.5}to{transform:translateY(0);opacity:1}}
.modal{
  width:100%;max-width:460px;max-height:88vh;
  background:var(--surface);
  border-radius:26px 26px 0 0;
  display:flex;flex-direction:column;
  animation:slideUp .22s cubic-bezier(.2,.8,.3,1);
  overflow:hidden;
  box-shadow:var(--shadow-lg);
}
@media(min-width:900px){.modal{border-radius:26px;max-height:82vh;}}
.modal-head{
  padding:16px 18px 12px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);flex:0 0 auto;
}
.modal-head h2{font-size:16.5px;font-weight:700;flex:1;}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;}
.modal-foot{
  padding:12px 18px calc(16px + var(--safe-b));
  border-top:1px solid var(--border);
  display:flex;gap:10px;background:var(--surface);flex:0 0 auto;
}

/* ---------- Toast (aria-live) ---------- */
#toasts{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 22px);
  left:50%;transform:translateX(-50%);
  z-index:200;display:flex;flex-direction:column;gap:8px;
  width:calc(100% - 32px);max-width:420px;pointer-events:none;
}
.toast{
  background:var(--text);color:#fff;border-radius:15px;
  padding:13px 15px;font-size:13.5px;font-weight:560;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow-lg);
  animation:slideUp .22s cubic-bezier(.2,.8,.3,1);
  pointer-events:auto;
}
.toast .t-ico{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;}
.toast.success .t-ico{background:var(--success);}
.toast.error .t-ico{background:var(--danger);}
.toast.info .t-ico{background:var(--info);}

/* ---------- État vide ---------- */
.empty{text-align:center;padding:44px 24px;color:var(--text-2);}
.empty .e-ico{
  width:66px;height:66px;border-radius:24px;margin:0 auto 14px;
  background:var(--surface-3);display:grid;place-items:center;color:var(--text-3);
}
.empty h3{font-size:15px;color:var(--text);margin-bottom:5px;}
.empty p{font-size:13px;margin:0 0 16px;line-height:1.5;}
.empty-inline{padding:14px;font-size:12.5px;color:var(--text-2);background:var(--surface-2);border-radius:12px;text-align:center;line-height:1.5;}

/* ---------- Divers ---------- */
.divider{height:1px;background:var(--border);margin:12px 0;}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-2);font-weight:560;flex:0 0 auto;}
.kv .v{font-weight:640;text-align:right;min-width:0;overflow-wrap:anywhere;}
.pill{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 11px;border-radius:999px;background:var(--surface-3);font-size:11.5px;font-weight:660;color:var(--text-2);}
.hint-sm{font-size:12px;color:var(--text-2);line-height:1.45;}
.center{text-align:center;}
details.guide{background:var(--surface-2);border:1px solid var(--border);border-radius:15px;padding:0;overflow:hidden;}
details.guide summary{
  list-style:none;display:flex;align-items:center;gap:9px;
  padding:12px 14px;font-size:13px;font-weight:680;color:var(--text-2);cursor:pointer;min-height:46px;
}
details.guide summary::-webkit-details-marker{display:none;}
details.guide summary .g-chev{margin-left:auto;transition:transform .2s;color:var(--text-3);}
details.guide[open] summary .g-chev{transform:rotate(90deg);}
details.guide .guide-body{padding:2px 14px 14px;font-size:12.5px;color:var(--text-2);line-height:1.6;border-top:1px dashed var(--border);}
details.guide .guide-body p{margin:8px 0 0;}
details.guide .guide-body b{color:var(--text);}
.scroll::-webkit-scrollbar{width:4px;}
.scroll::-webkit-scrollbar-thumb{background:rgba(43,41,37,.24);border-radius:99px;}
.scroll::-webkit-scrollbar-track{background:transparent;}

/* ---------- Auth ---------- */
#auth-root{position:fixed;inset:0;z-index:9999;display:none;overflow:auto;padding:20px;
  background:
    radial-gradient(900px 500px at 10% -10%,#eef2ea 0%,transparent 60%),
    radial-gradient(800px 500px at 110% 110%,#f3e9df 0%,transparent 55%),
    #efece4;}
.auth-box{width:min(420px,100%);margin:auto;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:26px;box-shadow:var(--shadow-lg)}
.auth-logo{width:60px;height:60px;border-radius:19px;background:linear-gradient(140deg,var(--primary),var(--primary-strong));color:#fff;display:grid;place-items:center;font-weight:850;font-size:18px;margin-bottom:18px}
.auth-box h1{font-size:22px}.auth-box>p{color:var(--text-2);font-size:13.5px;margin:6px 0 18px}.auth-box .field{margin-bottom:12px}
.auth-box label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.auth-box input{width:100%;padding:13px 14px;border:1.5px solid var(--border-strong);border-radius:14px;background:#fff;outline:none;font-size:15px}
.auth-box input:focus{border-color:var(--primary-strong);box-shadow:0 0 0 3px var(--primary-soft)}
.auth-demo{margin-top:14px;font-size:12px;color:var(--text-2);line-height:1.6}

<style>
/* ============================================================
   CSS MÉTIER V19 — Dashboard · Workflow · Documents · Responsive
   ============================================================ */

/* ---------- Auth users pill ---------- */
.profile-mini{width:40px;height:40px;border:0;border-radius:14px;background:linear-gradient(140deg,var(--primary),var(--primary-strong));color:#fff;font-weight:800;display:grid;place-items:center;flex:0 0 auto;}
.profile-mini:focus-visible{box-shadow:var(--ring);outline:none;}

/* ---------- Dashboard ---------- */
.dash-greeting{font-size:17px;}
.dash-section{margin-top:18px;}
.prio-card{
  background:linear-gradient(150deg,var(--primary-softer) 0%,var(--surface) 70%);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow-xs);
}
.prio-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.prio-head h2{font-size:16px;margin-top:2px;}
.prio-head p{font-size:12px;color:var(--text-2);margin-top:2px;}
.prio-stage{min-height:74px;}
.prio-slide{width:100%;text-align:left;}
.prio-main{display:flex;align-items:center;gap:12px;}
.prio-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:0 0 auto;}
.prio-title{font-size:14.5px;font-weight:700;line-height:1.3;}
.prio-meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--text-2);flex-wrap:wrap;}
.prio-go{color:var(--text-3);flex:0 0 auto;}
.prio-dots{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:10px;}
.prio-dot{width:7px;height:7px;border-radius:99px;background:var(--border-strong);padding:0;transition:all .2s;}
.prio-dot.on{background:var(--primary-strong);width:18px;}
.prio-arrows{display:flex;gap:6px;}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kpi{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:14px;
  box-shadow:var(--shadow-xs);text-align:left;width:100%;
  transition:transform .12s;border-color .15s;
  position:relative;
}
.kpi:active{transform:scale(.975);}
.kpi .kpi-top{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:4px;}
.kpi .kpi-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;}
.kpi .kpi-val{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.05;}
.kpi .kpi-lbl{font-size:12.5px;font-weight:680;color:var(--text-2);line-height:1.25;}
.kpi .kpi-sub{font-size:11.5px;color:var(--text-2);line-height:1.3;}
.kpi.emph{border-color:rgba(181,103,58,.45);background:linear-gradient(160deg,#fff,var(--accent-soft));}
.kpi.emph .kpi-val{color:var(--accent-strong);}

.recent-card{
  display:flex;align-items:center;gap:12px;
  padding:13px 15px;border:1px solid var(--border);border-radius:18px;
  background:var(--surface);box-shadow:var(--shadow-xs);
  width:100%;text-align:left;
}
.recent-dot{width:9px;height:9px;border-radius:50%;background:var(--primary-strong);flex:0 0 auto;}
.recent-text{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.recent-time{font-size:11px;color:var(--text-2);margin-left:auto;flex:0 0 auto;}
.admin-log{max-height:55vh;overflow:auto;}
.admin-log-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.admin-log-row b{display:block;font-size:13px;}
.admin-log-row small{display:block;color:var(--text-2);font-size:11px;margin-top:3px;}
.relance-row{width:100%;display:flex;align-items:center;gap:10px;padding:12px;border:0;border-bottom:1px solid var(--border);background:transparent;text-align:left;color:inherit;}
.relance-num{width:26px;height:26px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 auto;}
.relance-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;}
.relance-row b{display:block;font-size:13px;}
.relance-row small{display:block;color:var(--text-2);font-size:11px;margin-top:3px;}
.slide-in{animation:slideIn .3s ease;}
@keyframes slideIn{from{opacity:.2;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}

/* ---------- Workflow ---------- */
.wf-hero{
  border:1px solid var(--border);border-radius:var(--radius);
  background:linear-gradient(150deg,var(--primary-softer),var(--surface) 75%);
  padding:16px;box-shadow:var(--shadow-xs);
}
.wf-hero .wf-kicker{font-size:10.5px;letter-spacing:.12em;font-weight:800;color:var(--primary-strong);text-transform:uppercase;}
.wf-hero .wf-step-name{font-size:19px;font-weight:780;letter-spacing:-.02em;margin-top:3px;}
.wf-hero .wf-state{font-size:11.5px;font-weight:750;color:var(--primary-strong);background:var(--primary-soft);border-radius:999px;padding:4px 10px;}
.wf-steps{
  display:flex;gap:2px;overflow-x:auto;padding:6px 2px 12px;
  scrollbar-width:none;position:sticky;top:0;z-index:12;
  background:rgba(246,244,238,.96);backdrop-filter:blur(12px);
}
.wf-steps::-webkit-scrollbar{display:none;}
.wf-step{min-width:76px;flex:1;text-align:center;position:relative;color:var(--text-3);font-size:10.5px;font-weight:680;background:none;border:none;padding:4px 2px;border-radius:10px;}
.wf-step:not(:last-child)::after{content:"";position:absolute;top:17px;left:calc(50% + 19px);right:calc(-50% + 19px);height:2px;background:var(--border-strong);}
.wf-step.done:not(:last-child)::after{background:var(--success);}
.wf-circle{width:36px;height:36px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--border-strong);position:relative;z-index:2;font-size:12.5px;}
.wf-step.done{color:var(--success-text);}
.wf-step.done .wf-circle{background:var(--success);border-color:var(--success);color:#fff;}
.wf-step.current{color:var(--primary-strong);}
.wf-step.current .wf-circle{background:var(--primary-strong);border-color:var(--primary-strong);color:#fff;box-shadow:0 0 0 5px var(--primary-soft);}
.wf-step-label{display:block;line-height:1.25;}
.wf-current{border-color:rgba(74,124,111,.4);}
.wf-action{position:sticky;bottom:10px;z-index:10;box-shadow:var(--shadow);border-color:rgba(74,124,111,.4);}
.check.wf-check{cursor:pointer;border:1.5px solid var(--border);border-radius:13px;padding:11px;background:var(--surface);display:flex;align-items:flex-start;gap:9px;}
.check.wf-check.on{border-color:var(--primary-strong);background:var(--primary-softer);}
.commercial{background:linear-gradient(140deg,var(--primary-softer),var(--surface));border:1px solid var(--border);border-radius:18px;padding:15px;}
.commercial h3{font-size:15px;margin-bottom:5px;}
.commercial p{font-size:12.5px;color:var(--text-2);line-height:1.6;margin:0;}
.insight{border:1px solid var(--border);border-left:4px solid var(--info);background:var(--surface);border-radius:16px;padding:13px;}
.insight.warn{border-left-color:var(--warning);}
.insight.danger{border-left-color:var(--danger);}
.insight b{font-size:14px;}
.message-box{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:12px;font-size:13px;line-height:1.6;}
.workflow-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.doc-paper{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden;color:var(--text);}
.doc-head{padding:20px;border-bottom:1px solid var(--border);background:linear-gradient(140deg,var(--primary-softer),#fff);}
.doc-brand{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;}
.doc-brand-mark{width:44px;height:44px;border-radius:13px;background:var(--primary-strong);color:#fff;display:grid;place-items:center;font-weight:850;font-size:15px;}
.doc-brand-name{font-weight:800;font-size:16.5px;letter-spacing:-.02em;}
.doc-brand-sub{font-size:11px;color:var(--text-2);margin-top:2px;}
.doc-title{font-size:20px;font-weight:850;letter-spacing:-.03em;text-align:right;}
.doc-number{font-size:11px;color:var(--text-2);text-align:right;margin-top:3px;}
.doc-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px;background:#fff;}
.doc-meta{border:1px solid var(--border);border-radius:12px;padding:11px;}

.doc-meta-value{font-size:12.5px;font-weight:700;margin-top:4px;line-height:1.45;}
.doc-table{width:100%;border-collapse:collapse;font-size:11.5px;}
.doc-table th{background:var(--surface-3);color:var(--text-2);text-align:left;padding:9px 10px;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;}
.doc-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top;}
.doc-table .num{text-align:right;white-space:nowrap;}
.doc-totals{margin-left:auto;width:230px;max-width:70%;padding:14px 20px 6px;}
.doc-total-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12px;}
.doc-total-main{font-size:15px;font-weight:850;padding-top:9px;margin-top:5px;border-top:1.5px solid var(--text);}
.doc-footer{padding:14px 20px 18px;background:var(--surface-2);border-top:1px solid var(--border);font-size:10.5px;color:var(--text-2);line-height:1.6;}
.doc-note{margin:0 20px 14px;padding:10px 12px;border-left:3px solid var(--primary-strong);background:var(--primary-softer);border-radius:9px;font-size:11px;line-height:1.5;}
.message-paper{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);}
.message-head{padding:14px 16px;background:linear-gradient(140deg,var(--primary-softer),#fff);border-bottom:1px solid var(--border);}
.message-body{padding:16px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;}
.message-sign{padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-2);font-size:11.5px;color:var(--text-2);}
.quote-line,.invoice-line{transition:.15s;border:1px solid var(--border);}
.quote-line:focus-within,.invoice-line:focus-within{border-color:var(--primary-strong);box-shadow:0 0 0 3px var(--primary-soft);}

/* ---------- Portfolio ---------- */
.portfolio-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pf-card{border:1px solid var(--border);border-radius:18px;overflow:hidden;background:var(--surface);text-align:left;width:100%;box-shadow:var(--shadow-xs);}
.pf-thumb{height:86px;display:grid;place-items:center;color:#fff;}
.pf-body{padding:11px 12px;}
.pf-title{font-size:13px;font-weight:700;line-height:1.3;}
.pf-sub{font-size:11px;color:var(--text-2);margin-top:3px;}

/* ---------- Responsive & confort ---------- */
@media(max-width:360px){
  .pad{padding-left:13px;padding-right:13px;}
  .appbar{padding-left:13px;padding-right:13px;}
  .grid-2{gap:8px;}
  .grid-3{gap:7px;}
  .nav-item{font-size:9.5px;}
  .kpi .kpi-val{font-size:22px;}
}

  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(prefers-contrast:more){
  :root{--text-3:#5c584f;--border-strong:#a89f8d;}
  .badge::before{width:7px;height:7px;}
}
</style>

const AUTH_KEY='msn_manager_auth_v2';
let SESSION=null;
const DEFAULT_USERS=[
 {id:'USR-001',username:'admin',password:'admin123',name:'Administrateur MSN',role:'superadmin',active:true},
 {id:'USR-002',username:'membre',password:'membre123',name:'Membre MSN',role:'member',active:true}
];
function usersList(){
  DB.users = Array.isArray(DB.users)&&DB.users.length ? DB.users : structuredClone(DEFAULT_USERS);
  return DB.users;
}
function roleLabel(r){return r==='superadmin'?'Superadmin':'Membre';}
function can(action){
  if(!SESSION) return false;
  if(SESSION.role==='superadmin') return true;
  return !['admin','users','settings','services-edit','workflow-edit','delete'].includes(action);
}
function renderAuth(){
  const root=$('#auth-root'); if(!root) return;
  root.style.display=SESSION?'none':'flex';
  if(SESSION) return;
  root.innerHTML=`<div class="auth-box">
    <div class="auth-logo">MSN</div>
    <h1>MSN Manager</h1>
    <p>Connectez-vous pour accéder à votre espace de gestion client.</p>
    <form onsubmit="login(event)">
      <div class="field"><label for="login-user">Nom d'utilisateur</label><input id="login-user" autocomplete="username" required placeholder="ex. admin"></div>
      <div class="field"><label for="login-pass">Mot de passe</label><input id="login-pass" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
      <button class="btn primary block" type="submit">${icon('shield',17,2.2)} Se connecter</button>
    </form>
    <div class="auth-demo">Démo — admin : <b>admin / admin123</b> · membre : <b>membre / membre123</b></div>
  </div>`;
  setTimeout(()=>$('#login-user')?.focus(),60);
}
function login(e){
  e.preventDefault(); const u=$('#login-user').value.trim(); const pw=$('#login-pass').value;
  const user=usersList().find(x=>x.username===u&&x.password===pw&&x.active!==false);
  if(!user){toast('Identifiants incorrects','error');return;}
  SESSION={id:user.id,username:user.username,name:user.name,role:user.role};
  localStorage.setItem(AUTH_KEY,JSON.stringify(SESSION));
  renderAuth(); state.screen='dashboard'; state.history=[]; render(); toast(`Bienvenue ${user.name}`);
}
function logout(){SESSION=null;localStorage.removeItem(AUTH_KEY);closeModal();renderAuth();$('#app').innerHTML='';}
function currentUser(){return usersList().find(x=>x.id===SESSION?.id)||usersList()[0];}
function shortName(n){return (n||'').split(' ')[0]||'Admin';}

      const out = {...seed, ...d};
      ['users','clients','services','commands','quotes','invoices','tasks','templates','messages','notifications','files','activity','presentations','portfolio','receptions'].forEach(k=>{
        if(!Array.isArray(out[k])) out[k] = seed[k];
      });
      out.workflows = (d.workflows && typeof d.workflows==='object' && Object.keys(d.workflows).length) ? d.workflows : seed.workflows;

    }
  }catch(e){ console.warn('MSN Manager: données locales invalides, retour aux données de base.',e); }

}

function money(n){

function dateFr(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt.getTime())) return String(d);
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
}
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysFromNow(d){
  const a = new Date(todayStr()+'T00:00:00');
  const b = new Date(d+'T00:00:00');
  if(isNaN(b.getTime())) return 0;
  return Math.round((b-a)/86400000);
}
function deadlineLabel(d){
  const n = daysFromNow(d);
  if(n<0) return `Retard ${Math.abs(n)} j`;
  if(n===0) return "Aujourd'hui";

  return `Dans ${n} j`;
}

let __lastFocus=null;
function toast(msg, type='success'){
  const icons = {success:'check',error:'alert',info:'spark'};
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="t-ico" aria-hidden="true">${icon(icons[type]||'check',14,2.4)}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); }, 2600);
}
function openModal({title,body,footer,onMount}){
  __lastFocus=document.activeElement;
  const root = $('#modal-root');
  root.innerHTML = `
    <div class="modal-back" id="modal-back">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head">
          <h2 id="modal-title">${esc(title)}</h2>
          <button class="icon-btn ghost" onclick="closeModal()" aria-label="Fermer la fenêtre">${icon('x',18)}</button>
        </div>
        <div class="modal-body">${body}</div>
        ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
      </div>
    </div>`;
  const back=$('#modal-back');
  back.addEventListener('click', e=>{ if(e.target.id==='modal-back') closeModal(); });
  // Focus trap
  const modal=back.querySelector('.modal');
  const sel='button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])';
  const focusables=()=>[...modal.querySelectorAll(sel)].filter(x=>!x.disabled&&x.offsetParent!==null);
  (modal.querySelector('input,select,textarea')||focusables()[0]||modal).focus();
  modal.addEventListener('keydown',e=>{
    if(e.key!=='Tab')return;
    const f=focusables(); if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  });
  if(onMount) onMount(root);
}
function closeModal(){
  $('#modal-root').innerHTML='';
  if(__lastFocus&&document.contains(__lastFocus)){ try{__lastFocus.focus();}catch(e){} }
  __lastFocus=null;
}
function confirmDialog(title, msg, onConfirm){
  openModal({
    title,
    body:`<p style="margin:0;color:var(--text-2);font-size:14px;line-height:1.55">${esc(msg)}</p>`,
    footer:`<button class="btn soft grow" onclick="closeModal()">Annuler</button>
            <button class="btn danger grow" id="cf-ok">Confirmer</button>`,
    onMount:r=>{
      r.querySelector('#cf-ok').onclick = ()=>{ closeModal(); onConfirm(); };
    }
  });
}

function relatedQuote(c){ return DB.quotes.find(q=>q.client===c.client&&q.service===c.service) || null; }
function relatedInvoice(c){ return DB.invoices.find(i=>i.client===c.client&&i.service===c.service) || null; }
function relatedReception(c){
  if(c.receptionId) return DB.receptions.find(r=>r.id===c.receptionId)||null;
  return DB.receptions.find(r=>r.client===c.client&&r.service===c.service)||null;
}
/* État du parcours d'une commande : done / current / todo pour chaque étape liée */
function journeyFor(c){
  const wf = (DB.workflows[c.service]||DB.workflows.default||[]).filter(Boolean);
  const cur = Math.max(0,Math.min((c.step||1)-1,wf.length-1));
  const keysDone = wf.slice(0,cur).map(workflowKey);
  const curKey = workflowKey(wf[cur]);
  const afterDelivery = c.deliveredAt;
  const st = key => afterDelivery||keysDone.includes(key) ? 'done' : (curKey===key?'current':'todo');
  const quote = relatedQuote(c);
  const rec = relatedReception(c);
  return [

/* ============================================================
   Molette → défilement horizontal des bandes (desktop, a11y)
   .chips/.pipe/.journey/.tabs/.wf-steps n'ont pas de scrollbar :
   la molette verticale les fait défiler quand elles débordent.
   ============================================================ */
(function(){
  const HSCROLL='.chips,.pipe,.journey,.tabs,.wf-steps';
  document.addEventListener('wheel',e=>{
    if(!e.deltaY||e.deltaX) return;
    const el=e.target && e.target.closest && e.target.closest(HSCROLL);
    if(!el) return;
    const max=el.scrollWidth-el.clientWidth;
    if(max<=1) return;
    const before=el.scrollLeft;
    const after=Math.max(0,Math.min(max,before+e.deltaY));
    const consumed=Math.abs(after-before)>0.5;
    if(!consumed) return;                 // en butée : on laisse la page défiler
    el.scrollLeft=after;
    e.preventDefault();
  },{passive:false});
})();

      ${[1,2,3,4].map(i=>`<span class="wiz-seg ${i<=step?'on':''}" aria-hidden="true"></span>`).join('')}
      <span class="wiz-count">Étape ${step}/4</span>
    </div>`;
  const foot=(nextLabel,nextFn,showPrev=true)=>`
    <div class="wiz-nav">
      ${showPrev?`<button class="btn soft" onclick="receptionGo(${step-1})" ${step===1?'disabled':''}>${icon('back',16,2.2)} Retour</button>`:''}
      <button class="btn primary grow" onclick="${nextFn}">${nextLabel} ${icon('chev',16,2.2)}</button>
    </div>
  </div></div>`;

  /* ----- ÉTAPE 1 : Accueillir ----- */
  if(step===1){
    const recent=DB.receptions.slice(0,3);
    return `${head}
    <div class="card sage"><div class="row"><span style="color:var(--primary-strong)" aria-hidden="true">${icon('door',20,2.2)}</span><div class="grow"><b>Accueillir le client</b><p class="hint-sm mt-4">Identifiez votre interlocuteur et son canal. Aucune commande n’est créée à cette étape — le parcours reste souple.</p></div></div></div>
    <div class="card mt-12">
      <div class="field"><label for="rc-client">Client existant</label><select class="select" id="rc-client" onchange="receptionSelectClient(this.value)"><option value="">Nouveau client</option>${DB.clients.map(c=>`<option value="${c.id}" ${client?.id===c.id?'selected':''}>${esc(c.name)} — ${esc(c.phone)}</option>`).join('')}</select></div>
      <div class="grid-2"><div class="field"><label for="rc-name">Nom <span class="req">*</span></label><input class="input" id="rc-name" value="${esc(d.name||client?.name||'')}" placeholder="Nom du client"></div><div class="field"><label for="rc-phone">Téléphone <span class="req">*</span></label><input class="input" id="rc-phone" type="tel" value="${esc(d.phone||client?.phone||'')}" placeholder="+261 …"></div></div>
      <div class="field"><label for="rc-channel">Canal de contact</label><select class="select" id="rc-channel">${['WhatsApp','Messenger','Appel','Visite','Email'].map(x=>`<option ${d.channel===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label for="rc-email">Email (optionnel)</label><input class="input" id="rc-email" type="email" value="${esc(d.email||client?.email||'')}" placeholder="client@email.com"></div>
    </div>
    ${recent.length?`<div class="sec-head mt-16"><h2 style="font-size:14px">Réceptions récentes</h2><button class="link" onclick="toast('Historique complet bientôt disponible','info')">Tout voir</button></div>
    <div class="list-group">${recent.map(r=>`<div class="list-item" role="listitem"><div class="li-ico" style="background:var(--surface-3);color:var(--text-2)">${icon('door',17,2.2)}</div><div class="grow"><div class="li-title">${esc(r.name||'Client')}</div><div class="li-sub">${esc(r.service||'Service à qualifier')} · ${esc(r.channel||'')}</div></div>${badge(r.status)}</div>`).join('')}</div>`:''}
    ${foot('Continuer','receptionNext()')}`;
  }

  /* ----- ÉTAPE 2 : Présenter (services & tarifs) ----- */
  if(step===2){
    const cats=[...new Set(DB.services.filter(x=>x.active!==false).map(x=>x.cat||'Autres'))];
    const shown=DB.services.filter(x=>x.active!==false).slice(0,14);
    return `${head}
    <div class="card sage"><div class="row"><span style="color:var(--primary-strong)" aria-hidden="true">${icon('present',20,2.2)}</span><div class="grow"><b>Présenter MSN et les tarifs</b><p class="hint-sm mt-4">Choisissez un service pour afficher l’offre commerciale correspondante, puis partagez le message de bienvenue.</p></div></div></div>
    <div class="chips mt-12" role="list" aria-label="Catégories de services">${cats.map(c=>`<span class="chip" role="listitem">${esc(c)}</span>`).join('')}</div>
    <div class="card" style="padding:0;overflow:hidden">
      ${shown.map((sv,i)=>`<button class="list-item" style="border-bottom:${i===shown.length-1?'0':'1px solid var(--border)'}" onclick="receptionPickService('${esc(sv.name)}')" aria-label="Présenter ${esc(sv.name)}">
        <span class="li-ico" style="background:var(--primary-softer);color:var(--primary-strong)" aria-hidden="true">${icon('spark',17,2.1)}</span>
        <span class="grow"><span class="li-title">${esc(sv.name)}</span><span class="li-sub" style="display:block">${esc(sv.desc||sv.cat||'Service MSN')}</span></span>
        <span style="text-align:right;flex:0 0 auto"><b style="display:block">${sv.base>0?money(sv.base):'Sur devis'}</b><span class="hint-sm">${sv.base>0?'/ '+esc(sv.unit||'forfait'):''}</span></span>
        ${d.presentedService===sv.name?`<span class="j-dot" style="background:var(--primary-strong);color:#fff;border-color:var(--primary-strong)" aria-hidden="true">${icon('check',13,3)}</span>`:''}
      </button>`).join('')}
    </div>
    ${d.presentedService?`<div class="card sage mt-12">${renderReceptionOfferHtml(d.presentedService)}</div>`:''}
    <div class="sec-head mt-16"><h2 style="font-size:14px">Message d’accueil</h2><button class="btn xs soft" onclick="copyText(receptionWelcomeText());toast('Message copié')">${icon('copy',13,2.3)} Copier</button></div>
    <div class="card"><textarea class="textarea" id="rc-welcome" aria-label="Message d’accueil à envoyer au client" style="min-height:200px">${esc(receptionGreeting(d.name||client?.name))}</textarea>
      <button class="btn sage block mt-8" onclick="sendReceptionWelcome()">${icon('send',15,2.2)} Marquer comme envoyé au client</button></div>
    ${foot('Continuer','receptionNext()')}`;
  }

  /* ----- ÉTAPE 3 : Qualifier le besoin ----- */
  if(step===3){
    return `${head}
    <div class="card sage"><div class="row"><span style="color:var(--primary-strong)" aria-hidden="true">${icon('flow',20,2.2)}</span><div class="grow"><b>Qualifier le besoin</b><p class="hint-sm mt-4">Service envisagé, description et éléments fournis. Ces informations seront reprises automatiquement dans la commande.</p></div></div></div>
    <div class="card mt-12">
      <div class="field"><label for="rc-service">Service envisagé <span class="req">*</span></label><select class="select" id="rc-service" onchange="receptionQualifyService(this.value)"><option value="">Choisir le service…</option>${DB.services.filter(x=>x.active!==false).map(x=>`<option value="${esc(x.name)}" ${d.service===x.name?'selected':''}>${esc(x.name)} — ${x.base>0?money(x.base):'Sur devis'}</option>`).join('')}</select></div>
      <div id="rc-offer">${d.service?renderReceptionOfferHtml(d.service):`<div class="empty-inline">Sélectionnez un service pour afficher la présentation commerciale et le tarif correspondant.</div>`}</div>
      <div class="field mt-12"><label for="rc-desc">Besoin / demande initiale</label><textarea class="textarea" id="rc-desc" placeholder="Ce que le client souhaite obtenir…">${esc(d.desc||'')}</textarea></div>
      <div class="field"><span class="field-label">Éléments déjà disponibles</span><div class="grid-2"><label class="check" style="justify-content:center;cursor:pointer">${icon('upload',15,2.2)}<span>Importer un fichier<input type="file" id="rc-files" multiple hidden onchange="receptionFiles(this)"></span></label><button class="check" type="button" onclick="receptionAddLink()">${icon('link',15,2.2)}<span>Ajouter un lien</span></button></div>
      ${(d.files||[]).length?`<div class="stack mt-8">${d.files.map(f=>`<div class="list-item" style="border:1px solid var(--border);border-radius:12px;min-height:0;padding:9px 12px"><span aria-hidden="true">${icon('file',15)}</span><div class="grow"><b style="font-size:13px">${esc(f.name)}</b><div class="hint-sm">${esc(f.size||'Fichier')}</div></div></div>`).join('')}</div>`:''}
      ${(d.links||[]).length?`<div class="stack mt-8">${d.links.map(l=>`<div class="list-item" style="border:1px solid var(--border);border-radius:12px;min-height:0;padding:9px 12px"><span aria-hidden="true">${icon('link',15)}</span><div class="grow"><b style="font-size:13px">${esc(l)}</b></div></div>`).join('')}</div>`:''}
      </div>
    </div>
    ${foot('Continuer','receptionNext()')}`;
  }

  /* ----- ÉTAPE 4 : Conclure ----- */
  if(step===4){
    return `${head}
    <div class="card sage"><div class="row"><span style="color:var(--primary-strong)" aria-hidden="true">${icon('check',20,2.4)}</span><div class="grow"><b>Conclure la réception</b><p class="hint-sm mt-4">Vérifiez le récapitulatif. Après accord du client, enregistrez la réception puis préparez la commande — tout est déjà lié.</p></div></div></div>
    <div class="card mt-12">
      <div class="kv"><span class="k">Client</span><span class="v">${esc(d.name||'—')}${d.phone?` · ${esc(d.phone)}`:''}</span></div>
      <div class="kv"><span class="k">Canal</span><span class="v">${esc(d.channel||'—')}</span></div>
      <div class="kv"><span class="k">Présentation faite</span><span class="v">${d.presentedService?esc(d.presentedService):'—'}</span></div>
      <div class="kv"><span class="k">Service envisagé</span><span class="v">${d.service?esc(d.service):'—'}</span></div>
      <div class="kv"><span class="k">Besoin</span><span class="v">${esc((d.desc||'—').slice(0,60))}</span></div>
      <div class="kv"><span class="k">Éléments</span><span class="v">${(d.files||[]).length} fichier(s) · ${(d.links||[]).length} lien(s)</span></div>
    </div>
    <div class="card mt-12" style="border-color:rgba(74,124,111,.45);background:var(--primary-softer)">
      <b>Après accord du client</b>
      <p class="hint-sm mt-4">La commande reprend automatiquement ces informations et le workflow démarre à l’étape Réception — déjà marquée comme faite.</p>
      <button class="btn primary block mt-12" onclick="prepareOrderFromReception()">${icon('orders',17,2.2)} Enregistrer et préparer la commande</button>
      <button class="btn soft block mt-8" onclick="saveReceptionOnly()">${icon('clock',17,2.2)} Enregistrer sans commande</button>
    </div>
    ${foot('Retour au début','receptionReset()',false)}`;
  }
  return head+foot('Continuer','receptionNext()');
};
function receptionWelcomeText(){ return $('#rc-welcome')?.value||receptionGreeting(state.reception.draft.name); }
function receptionGo(step){ state.reception.step=Math.max(1,Math.min(4,step)); render(); }
function receptionReset(){ state.reception={step:1,draft:{}}; render(); }
function receptionSelectClient(id){
  const c=id?clientById(id):null;
  const d=state.reception.draft||{};
  state.reception.draft={...d,clientId:id||null,name:c?c.name:'',phone:c?c.phone:'',email:c?c.email:''};
  render();
}
function receptionPickService(name){ state.reception.draft={...(state.reception.draft||{}),presentedService:name}; render(); }
function receptionQualifyService(name){ state.reception.draft={...(state.reception.draft||{}),service:name}; const el=$('#rc-offer'); if(el)el.innerHTML=renderReceptionOfferHtml(name); }
function receptionCapture(){
  const d=state.reception.draft||{};
  d.name=$('#rc-name')?.value.trim()||d.name;
  d.phone=$('#rc-phone')?.value.trim()||d.phone;
  d.email=$('#rc-email')?.value.trim()||d.email;
  d.channel=$('#rc-channel')?.value||d.channel;
  state.reception.draft=d;
  return d;
}
function receptionNext(){
  const step=state.reception.step;
  const d=receptionCapture();
  if(step===1){
    if(!d.name||!d.phone){toast('Le nom et le téléphone sont obligatoires.','error');return;}
    receptionGo(2);return;
  }
  if(step===2){
    if(!d.presentedService){toast('Présentez au moins un service au client.','error');return;}
    receptionGo(3);return;
  }
  if(step===3){
    if(!d.service){toast('Sélectionnez le service envisagé.','error');return;}
    receptionGo(4);return;
  }
}
function renderReceptionOfferHtml(name){
  const s=DB.services.find(x=>x.name===name);if(!s)return '';
  const p=DB.presentations.find(x=>x.service===name);
  const benefits=p?.benefits||[s.desc||'Solution adaptée au besoin du client','Processus professionnel','Validation avant livraison'];
  const process=p?.process||['Cadrage du besoin','Réalisation','Présentation','Corrections prévues','Validation','Livraison'];
  return `<div>
    <div class="row-between"><div class="grow"><h3 style="font-size:15px">${esc(name)}</h3><p class="hint-sm" style="margin-top:2px">${esc(s.desc||'Présentation commerciale MSN')}</p></div><strong style="font-size:16px;color:var(--primary-strong);flex:0 0 auto">${s.base>0?money(s.base):'Sur devis'}</strong></div>
    <div class="grid-2 mt-12" style="gap:12px">
      <div><b style="font-size:12.5px">Ce que le client obtient</b><ul style="margin-top:6px;display:grid;gap:4px">${benefits.slice(0,4).map(x=>`<li class="hint-sm" style="display:flex;gap:6px"><span aria-hidden="true" style="color:var(--success-text)">✓</span>${esc(x)}</li>`).join('')}</ul></div>
      <div><b style="font-size:12.5px">Processus</b><ol style="margin-top:6px;display:grid;gap:4px;counter-reset:st">${process.slice(0,6).map((x,i)=>`<li class="hint-sm" style="display:flex;gap:6px"><b style="color:var(--primary-strong)">${i+1}.</b>${esc(x)}</li>`).join('')}</ol></div>
    </div>
    <button class="btn soft block mt-12" onclick="go('presentations')">${icon('present',15,2.2)} Voir la présentation commerciale complète</button>
  </div>`;
}
function sendReceptionWelcome(){
  const msg=receptionWelcomeText();
  if(!msg.trim()){toast('Le message est vide.','error');return;}
  copyText(msg);
  const d=receptionCapture();
  DB.receptions.unshift({id:'REC-'+Date.now(),client:d.clientId||null,name:d.name||'',phone:d.phone||'',channel:d.channel||'WhatsApp',message:msg,type:'welcome',status:'qualifiee',sentAt:new Date().toISOString()});
  saveDB();
  toast('Message copié — réception enregistrée','success');
}
function receptionFiles(input){
  state.reception.draft={...(state.reception.draft||{}),files:Array.from(input.files||[]).map(f=>({name:f.name,size:Math.round(f.size/1024)+' Ko',type:f.type}))};
  toast(`${input.files?.length||0} fichier(s) joint(s)`,'success');
}
function receptionAddLink(){
  const u=prompt('Collez le lien vers le fichier, dossier Drive, WeTransfer ou référence client.');
  if(!u)return;
  const d=state.reception.draft||{};
  state.reception.draft={...d,links:[...(d.links||[]),u.trim()]};
  toast('Lien ajouté');
}
function saveReceptionOnly(){
  const d=receptionCapture();
  if(!d.name||!d.phone){toast('Nom et téléphone requis.','error');return;}
  DB.receptions.unshift({id:'REC-'+Date.now(),client:d.clientId||null,name:d.name,phone:d.phone,channel:d.channel||'WhatsApp',service:d.service||'',desc:d.desc||'',status:'qualifiee',at:new Date().toISOString()});
  DB.activity.unshift({id:'A'+Date.now(),type:'client',text:`Réception enregistrée — ${d.name}`,time:"à l'instant"});
  saveDB();
  state.reception={step:1,draft:{}};
  toast('Réception enregistrée — le client reste en suivi','success');
  go('dashboard');
}
function prepareOrderFromReception(){
  const d=receptionCapture();
  if(!d.name||!d.phone||!d.service){toast('Nom, téléphone et service sont obligatoires.','error');return;}
  DB.receptions.unshift({id:'REC-'+Date.now(),client:d.clientId||null,name:d.name,phone:d.phone,service:d.service,channel:d.channel||'WhatsApp',status:'convertis',at:new Date().toISOString()});
  saveDB();
  go('new-request',{fromReception:true,draft:d});
}

SCREENS['new-request'] = (params={}) => {

  return `${appbar('Préparer la commande',{sub:fromReception?'Suite directe de la réception — rien à ressaisir':'Nouvelle commande', back:true})}
  <div class="scroll"><div class="pad pad-y">
    ${fromReception?`<div class="card sage"><div class="row"><span style="color:var(--primary-strong)" aria-hidden="true">${icon('check',18,2.4)}</span><div class="grow"><b>Réception déjà effectuée</b><p class="hint-sm mt-4">Les informations recueillies à l’accueil sont reprises automatiquement. Complétez uniquement ce qui manque.</p></div></div></div>`:''}
    <div class="card mt-12">
      <div class="field"><label for="nr-name">Nom du client <span class="req">*</span></label><input class="input" id="nr-name" value="${esc(d.name||'')}" placeholder="Ex. Amina Rakoto" autocomplete="name"></div>
      <div class="grid-2"><div class="field"><label for="nr-phone">Téléphone <span class="req">*</span></label><input class="input" id="nr-phone" type="tel" value="${esc(d.phone||'')}" placeholder="+261 …"></div>
      <div class="field"><label for="nr-channel">Canal</label><select class="select" id="nr-channel">${['WhatsApp','Messenger','Appel','Visite','Email'].map(x=>`<option ${d.channel===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
      <div class="field"><label for="nr-service">Service <span class="req">*</span></label><select class="select" id="nr-service" onchange="onServiceChange(this.value,'nr')"><option value="">Sélectionner un service…</option>${DB.services.filter(x=>x.active!==false).map(s=>`<option value="${esc(s.name)}" data-price="${s.base||0}" ${d.service===s.name?'selected':''}>${esc(s.name)} — ${s.base>0?money(s.base):'Sur devis'}</option>`).join('')}</select></div>
      <div class="field"><label for="nr-desc">Description du besoin</label><textarea class="textarea" id="nr-desc" placeholder="Décrivez la demande du client…">${esc(d.desc||'')}</textarea></div>
      <div class="grid-2"><div class="field"><label for="nr-deadline">Deadline souhaitée</label><input class="input" type="date" id="nr-deadline" value="${esc(d.deadline||addDays(7))}"></div><div class="field"><label for="nr-budget">Budget indicatif (Ar)</label><input class="input" type="number" inputmode="numeric" id="nr-budget" placeholder="0" value="${Number(d.budget||0)||''}"></div></div>
      <div class="field"><span class="field-label">Urgence</span><div class="segmented" id="nr-urgency" role="radiogroup" aria-label="Niveau d'urgence"><button type="button" onclick="pickUrgency(this,'basse')">Basse</button><button type="button" class="on" onclick="pickUrgency(this,'moyenne')">Moyenne</button><button type="button" onclick="pickUrgency(this,'haute')">Haute</button></div></div>
      <div class="field"><label for="nr-notes">Remarques internes</label><textarea class="textarea" id="nr-notes" placeholder="Notes utiles pour le travail…" style="min-height:70px"></textarea></div>
    </div>
    <button class="btn primary block mt-12" onclick="createOrderFromRequest()">${icon('play',17,2.3)} Confirmer la commande et ouvrir le workflow</button>
  </div></div>`;
};
function pickUrgency(el,val){el.parentElement.querySelectorAll('button').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false');});el.classList.add('on');el.setAttribute('aria-pressed','true');el.parentElement.dataset.val=val;}
function onServiceChange(val,prefix){const sel=document.getElementById(prefix+'-service'),opt=sel?.options[sel.selectedIndex],price=opt?.dataset?.price;if(price&&document.getElementById(prefix+'-budget'))document.getElementById(prefix+'-budget').value=price||'';}

function createOrderFromRequest(){
  const name=$('#nr-name')?.value.trim(),phone=$('#nr-phone')?.value.trim(),service=$('#nr-service')?.value,desc=$('#nr-desc')?.value.trim()||'',deadline=$('#nr-deadline')?.value||addDays(7),budget=parseFloat($('#nr-budget')?.value||0)||0,notes=$('#nr-notes')?.value.trim()||'',urgency=$('#nr-urgency')?.dataset.val||'moyenne',channel=$('#nr-channel')?.value||'WhatsApp';
  if(!name||!phone||!service){toast('Renseignez au minimum le client, le téléphone et le service.','error');return;}
  let client=DB.clients.find(c=>c.phone===phone);
  if(!client){const clientId='CL-'+String(DB.clients.length+1).padStart(3,'0');client={id:clientId,name,phone,email:$('#nr-email')?.value||'',city:'—',orders:0,total:0,last:todayStr(),notes:'',created:todayStr()};DB.clients.push(client);}
  client.orders=(client.orders||0)+1;client.total=(client.total||0)+budget;client.last=todayStr();
  const wf=(DB.workflows[service]||DB.workflows.default||[]).filter(Boolean);
  if(!wf.some(x=>workflowKey(x)==='paiement')){const di=wf.findIndex(x=>workflowKey(x)==='livraison');if(di>=0)wf.splice(di,0,'Paiement');else wf.push('Paiement');}
  if(!wf.some(x=>workflowKey(x)==='livraison'))wf.push('Livraison');
  DB.workflows[service]=wf;
  const startsReception=workflowKey(wf[0])==='reception';
  const initialStep=startsReception?2:1;
  const id='CMD-'+(2409+DB.commands.filter(c=>c.id.startsWith('CMD-')).length);
  const rec=DB.receptions[0];
  const cmd={id,client:client.id,service,status:'en_cours',created:todayStr(),deadline,amount:budget||0,progress:Math.round(((initialStep-1)/Math.max(wf.length-1,1))*100),priority:urgency,notes,desc,paid:0,step:initialStep,totalSteps:wf.length,channel,brief:null,desc,paid:0,receptionId:rec&&rec.status!=='convertis'?rec.id:(rec?rec.id:null),workflowLog:[{step:1,label:wf[0]||'Réception',at:new Date().toISOString(),status:'completed',source:'reception'}]};
  DB.commands.unshift(cmd);
  if(rec)rec.status='convertis';
  DB.activity.unshift({id:'A'+Date.now(),type:'order',text:`Nouvelle commande ${id} — ${name}`,time:"à l'instant"});
  state.reception={step:1,draft:{}};
  saveDB();
  toast('Commande créée — workflow ouvert à la suite de la réception','success');
  go('workflow',{id});
}

/* ============================================================
   WORKFLOW ASSISTANT OPÉRATIONNEL (corrigé + lié)
   ============================================================ */
const WORKFLOW_RULES={
  reception:{title:'Réception',goal:'Enregistrer et accuser réception de la demande.',policy:'Ne jamais considérer une demande comme traitée sans identifier le client, le service et la demande reçue.',action:'La réception a été validée par le formulaire d’accueil.'},
  brief:{title:'Brief client',goal:'Obtenir toutes les informations nécessaires avant de produire.',policy:'Ne pas commencer la production si le besoin, le format, les contraintes ou la deadline restent ambigus.',action:'Faire remplir le brief directement dans MSN Manager.'},
  analyse:{title:'Analyse',goal:'Transformer le besoin en plan de travail clair.',policy:'Identifier les contraintes, risques, informations manquantes et critères de réussite avant exécution.',action:'Analyser puis enregistrer le cadrage.'},
  recherche:{title:'Recherche / préparation',goal:'Préparer les références et éléments nécessaires.',policy:'Toute référence utilisée doit servir le besoin du client et respecter les contraintes du projet.',action:'Enregistrer les références et valider la préparation.'},
  conception:{title:'Production',goal:'Réaliser la prestation conformément au brief validé.',policy:'Travailler selon le brief et contrôler le résultat avant présentation.',action:'Traiter les tâches dans l’application et enregistrer leur avancement.'},
  presentation:{title:'Présentation',goal:'Présenter le résultat au client de manière compréhensible.',policy:'Présenter ce qui a été réalisé, les éléments livrés et la décision attendue du client.',action:'Préparer et envoyer la présentation.'},
  retours:{title:'Retours client',goal:'Collecter les retours sans perdre le cadre du projet.',policy:'Distinguer une demande de correction d’une nouvelle demande hors périmètre.',action:'Enregistrer les retours puis décider : correction ou nouveau besoin.'},
  corrections:{title:'Corrections',goal:'Traiter les modifications demandées.',policy:'Appliquer uniquement les corrections validées et vérifier le résultat avant une nouvelle présentation.',action:'Traiter les tâches de correction puis renvoyer la version.'},
  validation:{title:'Validation',goal:'Obtenir une décision explicite du client.',policy:'Aucune livraison finale sans validation explicite ou procédure de refus documentée.',action:'Choisir Validé ou Non validé et générer le message correspondant.'},
  paiement:{title:'Paiement',goal:'Enregistrer le règlement avant la livraison.',policy:'Une référence et un mode de paiement sont obligatoires avant le passage en livraison.',action:'Enregistrer le paiement.'},
  livraison:{title:'Livraison',goal:'Livrer les fichiers et clôturer correctement la prestation.',policy:'Vérifier les livrables, le format et le destinataire avant confirmation.',action:'Confirmer la livraison.'},
  archivage:{title:'Archivage',goal:'Conserver une trace exploitable du projet.',policy:'Archiver les fichiers, messages, validations et informations de paiement.',action:'Clôturer et archiver.'}
};
function workflowKey(label){
  const x=(label||'').toLowerCase();
  if(x.includes('réception')||x.includes('reception'))return'reception'; if(x.includes('brief'))return'brief'; if(x.includes('analyse'))return'analyse';
  if(x.includes('recherche')||x.includes('inspiration')||x.includes('préparation'))return'recherche';
  if(x.includes('conception')||x.includes('production')||x.includes('création')||x.includes('réalisation')||x.includes('développement')||x.includes('maquette')||x.includes('saisie')||x.includes('contenu'))return'conception';
  if(x.includes('présentation'))return'presentation'; if(x.includes('retour'))return'retours'; if(x.includes('correction'))return'corrections';
  if(x.includes('validation'))return'validation'; if(x.includes('paiement'))return'paiement'; if(x.includes('livraison')||x.includes('ligne'))return'livraison'; if(x.includes('archiv'))return'archivage';
  return'conception';
}
function currentWorkflowRule(label){return WORKFLOW_RULES[workflowKey(label)]||WORKFLOW_RULES.conception;}
function workflowInsight(c,cl){
  const now = new Date();
  const deadline = c && c.deadline ? new Date(c.deadline + 'T23:59:59') : null;
  const workflow = (DB.workflows[c.service] || DB.workflows.default || []);
  const currentLabel = workflow[Math.max(0,(c.step||1)-1)] || '';
  const key = workflowKey(currentLabel);
  if(deadline && !Number.isNaN(deadline.getTime()) && deadline < now && !['termine','en_livraison'].includes(c.status)){
    return {kind:'danger',title:'Retard détecté',text:`La date prévue (${dateFr(c.deadline)}) est dépassée.`,
      message:`Bonjour ${cl.name},\n\nNous constatons que l'échéance prévue pour votre ${c.service} est dépassée. Nous vérifions actuellement l'état d'avancement afin de vous proposer une solution et une nouvelle échéance réaliste.\n\nNous revenons vers vous avec une confirmation précise.\n\n— Équipe MSN`};
  }
  if(c.status==='en_correction' || c.validation==='non_valide'){
    return {kind:'warn',title:'Corrections à traiter',text:'Le client a demandé des modifications. Les corrections doivent être cadrées avant reprise.',
      message:`Bonjour ${cl.name},\n\nNous avons bien enregistré vos demandes de modification concernant votre ${c.service}. Nous allons les traiter selon le périmètre du projet puis vous présenter une nouvelle version pour validation.\n\n— Équipe MSN`};
  }
  if(c.status==='en_validation' || key==='validation' || key==='presentation'){
    return {kind:'info',title:'Décision client attendue',text:'La prochaine décision doit être explicite : validation ou demande de modifications.',
      message:workflowMessageFor(c,cl,currentWorkflowRule(currentLabel))};
  }
  return null;
}
function workflowMessageFor(c,cl,rule){
  if(rule.title==='Retours client') return `Bonjour ${cl.name},\n\nNous avons bien pris en compte vos retours concernant ${c.service}. Nous allons les analyser et vous confirmer les corrections à effectuer.\n\n— Équipe MSN`;
  if(rule.title==='Présentation') return `Bonjour ${cl.name},\n\nLa présentation de votre ${c.service} est prête. Nous vous invitons à vérifier le résultat et à nous confirmer : « Validé » ou « Modifications ».\n\n— Équipe MSN`;
  if(rule.title==='Validation') return `Bonjour ${cl.name},\n\nNous arrivons à l'étape de validation de votre ${c.service}. Merci de confirmer la version ou de nous indiquer précisément les modifications souhaitées.\n\n— Équipe MSN`;
  return `Bonjour ${cl.name},\n\nNous poursuivons actuellement l'étape « ${rule.title} » de votre ${c.service}. ${rule.goal}\n\n— Équipe MSN`;
}

function captureBriefFiles(input,id){const c=DB.commands.find(x=>x.id===id);if(!c)return;c.briefFiles=Array.from(input.files||[]).map(f=>({name:f.name,size:Math.round(f.size/1024)+' Ko',type:f.type}));saveDB();render();}
function addBriefLink(id){const c=DB.commands.find(x=>x.id===id);if(!c)return;const u=prompt('Collez le lien vers un fichier, dossier Drive, WeTransfer, etc.');if(!u)return;c.briefLinks=c.briefLinks||[];c.briefLinks.push(u.trim());saveDB();render();}
function checkedTexts(selector){return [...document.querySelectorAll(selector+'.on')].map(x=>x.innerText.trim());}
function saveBriefAndContinue(id){const c=DB.commands.find(x=>x.id===id);if(!c)return;const domains=checkedTexts('.wf-domain');const objective=$('#wf-brief-objective')?.value.trim();if(!domains.length&&!$('#wf-brief-domain-custom')?.value.trim()){toast('Sélectionnez d’abord le domaine du projet.','error');return;}if(!objective){toast('L’objectif du client est obligatoire.','error');return;}c.brief={...(c.brief||{}),domains,domainCustom:$('#wf-brief-domain-custom')?.value.trim()||'',objective,content:$('#wf-brief-content')?.value.trim()||'',types:checkedTexts('.wf-type'),constraints:checkedTexts('.wf-constraint')};completeCurrentWorkflowStep(id);}
