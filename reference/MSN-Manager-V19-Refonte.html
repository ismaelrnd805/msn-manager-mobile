function customizePlan(id){const c=DB.commands.find(x=>x.id===id);if(!c)return;openModal({title:'Personnaliser le plan',body:`<div class="field"><label for="plan-custom">Étapes du plan</label><textarea class="textarea" id="plan-custom" placeholder="Une étape par ligne">${esc((c.plan?.items||[]).join('\n'))}</textarea></div><div class="hint-sm">Gardez uniquement les actions réellement nécessaires pour ce service.</div>`,footer:`<button class="btn soft grow" onclick="closeModal()">Annuler</button><button class="btn primary grow" onclick="saveCustomPlan('${id}')">Enregistrer</button>`});}
function saveCustomPlan(id){const c=DB.commands.find(x=>x.id===id);if(!c)return;const items=$('#plan-custom')?.value.split('\n').map(x=>x.trim()).filter(Boolean)||[];if(!items.length){toast('Ajoutez au moins une étape.','error');return;}c.plan={items};saveDB();closeModal();render();}
function savePlanAndContinue(id){const c=DB.commands.find(x=>x.id===id);if(!c)return;c.plan=c.plan||{items:['Analyser le brief','Préparer les éléments','Réaliser la prestation','Contrôler le résultat']};completeCurrentWorkflowStep(id);}

/* Présentation + porte de décision (boucle validation ↔ corrections) */
function presentationForm(c,cl){
  const p=c.presentation||{}, f=c.feedback||{}, selected=Array.isArray(f.cases)?f.cases:[], sent=!!p.sentAt;
  const msg=p.message||`Bonjour ${cl.name},

Nous vous présentons votre ${c.service}.

Merci de vérifier le résultat par rapport au brief validé :
• contenu et informations ;
• format et dimensions ;
• éléments demandés ;
• conformité aux contraintes convenues.

Après vérification, merci de choisir :
✓ Validé : passage au paiement.
✕ Non validé : indiquez les corrections. Cette boucle reste active jusqu’à validation.

— Équipe MSN`;
  return `<div class="card mt-12 wf-current">
    <div class="sec-head"><div><h2 style="font-size:14px">Présentation & retour client</h2><p class="hint-sm mt-4">Cette étape reste active jusqu’à validation explicite.</p></div><span class="pill">${sent?'Retour attendu':'À préparer'}</span></div>
    <div class="commercial mt-12"><h3>Décision attendue</h3><p>La réponse du client détermine directement la suite du workflow.</p></div>
    <div class="field mt-12"><label for="presentation-msg">Message de présentation client</label><textarea class="textarea" id="presentation-msg" style="min-height:190px">${esc(msg)}</textarea></div>
    <div class="row" style="gap:8px"><button class="btn soft grow" onclick="copyText($('#presentation-msg').value);toast('Message copié')">${icon('copy',15,2.2)} Copier</button><button class="btn primary grow" onclick="sendPresentation('${c.id}')">${icon('send',15,2.2)} ${sent?'Renvoyer':'Envoyer au client'}</button></div>
    <div class="card soft mt-14" style="border-color:rgba(74,124,111,.4)">
      <div class="sec-head"><b style="font-size:14px">Retour du client</b><span class="pill">Obligatoire</span></div>
      <div class="grid-2 mt-8">
        <button type="button" class="choice ${c.validation==='valide'?'selected':''}" onclick="selectPresentationDecision('valid')"><b>✓ Validé</b><div class="hint-sm" style="margin-top:3px">Passer au paiement</div></button>
        <button type="button" class="choice ${c.validation==='non_valide'?'selected':''}" onclick="selectPresentationDecision('invalid')"><b>✕ Non validé</b><div class="hint-sm" style="margin-top:3px">Retourner aux corrections</div></button>
      </div>
      <div id="presentation-feedback-details" class="mt-12" style="${c.validation==='non_valide'?'':'display:none'}">
        <span class="field-label">Cas de retour</span>
        <div class="stack mt-8">${['Texte à corriger','Image / élément à remplacer','Mise en page à modifier','Format / dimensions à modifier','Nouvelle demande hors périmètre','Autre'].map(x=>`<button class="check wf-check wf-pfeedback ${selected.includes(x)?'on':''}" type="button" onclick="this.classList.toggle('on')" aria-pressed="${selected.includes(x)}">${icon(selected.includes(x)?'check':'grid',14,2.4)}<span>${x}</span></button>`).join('')}</div>
        <div class="field mt-10"><label for="presentation-feedback-custom">Retour personnalisé</label><textarea class="textarea" id="presentation-feedback-custom" placeholder="Précisez la demande du client…" style="min-height:70px">${esc(f.custom||'')}</textarea></div>
      </div>
      <button class="btn primary block mt-12" onclick="savePresentationDecision('${c.id}')">${icon('check',17,2.3)} Enregistrer le retour</button>
      <div class="hint-sm mt-8">Tant que le client n’est pas validé, aucun passage au paiement n’est autorisé.</div>
    </div>
  </div>`;
}
function selectPresentationDecision(kind){
  const card=document.getElementById('presentation-feedback-details');
  document.querySelectorAll('.choice.success,.choice.danger,.choice').forEach(x=>x.classList.remove('selected'));
  const choices=document.querySelectorAll('.choice');
  if(kind==='valid'){
    choices[0]?.classList.add('selected');
    if(card)card.style.display='none';
    window.__presentationDecision='valid';
  }else{
    choices[1]?.classList.add('selected');
    if(card)card.style.display='block';
    window.__presentationDecision='invalid';
  }
}
function sendPresentation(id,resend){
  const c=DB.commands.find(x=>x.id===id);
  if(!c)return;
  const message=$('#presentation-msg')?.value.trim()||'';
  if(!message){toast('Le message de présentation est obligatoire.','error');return;}
  c.presentation={...(c.presentation||{}),message,sentAt:new Date().toISOString()};
  c.status='en_validation';
  saveDB();
  DB.activity.unshift({id:'A'+Date.now(),type:'order',text:`Présentation envoyée — ${c.id}`,time:"à l'instant"});
  toast(resend?'Présentation renvoyée — retour client attendu':'Présentation envoyée — retour client attendu','success');
  render();
}
function savePresentationDecision(id){
  const c=DB.commands.find(x=>x.id===id);if(!c)return;
  const decision=window.__presentationDecision;
  if(!decision){toast('Choisissez Validé ou Non validé.','error');return;}
  const wf=(DB.workflows[c.service]||DB.workflows.default||[]).filter(Boolean);
  const current=Math.max(0,Math.min((c.step||1)-1,wf.length-1));
  if(decision==='valid'){
    c.feedback={cases:['Validé'],custom:'',at:new Date().toISOString()};
    c.validation='valide';c.status='paiement_attente';
    let target=wf.findIndex((x,i)=>i>current&&workflowKey(x)==='paiement');
    if(target<0)target=Math.min(current+1,wf.length-1);
    c.step=target+1;c.progress=Math.round(target/Math.max(wf.length-1,1)*100);
    c.updatedAt=new Date().toISOString();saveDB();window.__presentationDecision=null;
    toast('Client validé → paiement','success');go('workflow',{id:c.id});return;
  }
  const cases=checkedTexts('.wf-pfeedback'),custom=$('#presentation-feedback-custom')?.value.trim()||'';
  if(!cases.length&&!custom){toast('Indiquez au moins une correction ou un retour personnalisé.','error');return;}
  c.feedback={cases:['Non validé',...cases],custom,at:new Date().toISOString()};
  c.validation='non_valide';c.status='en_correction';
  const pi=wf.findIndex(x=>workflowKey(x)==='presentation');
  let correction=-1;
  for(let i=Math.max(0,pi-1);i>=0;i--)if(['corrections','production','conception','analyse'].includes(workflowKey(wf[i]))){correction=i;break;}
  c.step=(correction>=0?correction:pi>=0?pi:current)+1;
  c.progress=Math.round((c.step-1)/Math.max(wf.length-1,1)*100);
  c.updatedAt=new Date().toISOString();saveDB();window.__presentationDecision=null;
  toast('Non validé → corrections → nouvelle présentation','info');go('workflow',{id:c.id});
}
function feedbackForm(c,cl){
  const selected=c.feedback?.cases||[];
  return `<div class="card mt-12"><div class="sec-head"><h2 style="font-size:14px">Retour client</h2><span class="pill">À qualifier</span></div><p class="hint-sm">Cochez tous les cas applicables puis ajoutez une précision si nécessaire.</p><div class="stack mt-8">${['Validé tel quel','Texte à corriger','Image / élément à remplacer','Mise en page à modifier','Format / dimensions à modifier','Nouvelle demande hors périmètre','Autre'].map(x=>`<button class="check wf-check wf-feedback ${selected.includes(x)?'on':''}" type="button" onclick="this.classList.toggle('on')" aria-pressed="${selected.includes(x)}">${icon(selected.includes(x)?'check':'grid',14,2.4)}<span>${x}</span></button>`).join('')}</div><div class="field mt-12"><label for="feedback-custom">Retour personnalisé</label><textarea class="textarea" id="feedback-custom" placeholder="Décrivez précisément le retour du client…">${esc(c.feedback?.custom||'')}</textarea></div><button class="btn primary block" onclick="saveFeedback('${c.id}')">${icon('check',17,2.3)} Enregistrer le retour</button></div>`;
}
function saveFeedback(id){
  const c=DB.commands.find(x=>x.id===id);if(!c)return;
  c.feedback={cases:checkedTexts('.wf-feedback'),custom:$('#feedback-custom')?.value.trim()||''};
  const cases=c.feedback.cases||[];
  const wf=(DB.workflows[c.service]||DB.workflows.default||[]).filter(Boolean);
  if(cases.includes('Validé tel quel')){
    c.validation='valide';c.status='paiement_attente';
    const paymentIndex=wf.findIndex(x=>workflowKey(x)==='paiement');
    if(paymentIndex>=0)c.step=paymentIndex+1;
  }else{
    c.validation='non_valide';c.status='en_correction';
    const correctionIndex=wf.findIndex(x=>workflowKey(x)==='corrections');
    if(correctionIndex>=0)c.step=correctionIndex+1;
  }
  c.progress=Math.round(((c.step-1)/Math.max(wf.length-1,1))*100);
  saveDB();toast(c.validation==='valide'?'Retour validé → paiement':'Retour enregistré → corrections','success');render();
}
function workflowActionPanel(c,cl,rule,wf,cur){
  if(rule.title==='Brief client') return workflowBriefForm(c);
  if(rule.title==='Analyse') return workflowPlanForm(c);
  if(workflowKey(rule.title)==='presentation') return presentationForm(c,cl);
  if(workflowKey(rule.title)==='retours') return feedbackForm(c,cl);
  if(workflowKey(rule.title)==='validation') return `<div class="card mt-12"><h2 style="font-size:14px;margin-bottom:10px">Décision</h2><div class="choice-grid"><button class="choice" onclick="validateCommand('${c.id}',true)"><b>✓ Validé</b><div class="hint-sm" style="margin-top:3px">Passer à la demande de paiement</div></button><button class="choice" onclick="validateCommand('${c.id}',false)"><b>✕ Non validé</b><div class="hint-sm" style="margin-top:3px">Retourner aux corrections</div></button></div></div>`;
  if(rule.title==='Paiement') return paymentGate(c);
  if(rule.title==='Livraison') return paymentGate(c,true);
  return `<div class="card wf-action mt-12"><div class="row-between"><div><b>Action à réaliser maintenant</b><div class="hint-sm mt-4">${esc(rule.action)}</div></div></div><button class="btn primary block mt-12" onclick="completeCurrentWorkflowStep('${c.id}')">${icon('check',17,2.2)} Terminer cette étape</button></div>`;
}
function paymentGate(c,delivery=false){
  const amount=Number(c.amount||0),paid=Number(c.paid||0);
  const paidOk=paid>=amount&&!!c.payment?.ref&&!!c.payment?.mode&&!!c.payment?.date&&c.payment?.accountReady;
  if(paidOk&&delivery)return `<div class="card wf-action mt-12" style="border-color:var(--success)">
    <b>Paiement vérifié ✓</b>
    <p class="hint-sm mt-8">${esc(c.payment.mode)} · Réf. ${esc(c.payment.ref)} · ${esc(c.payment.date)} · ${money(c.payment.amount||paid)}</p>
    <button class="btn success block mt-12" onclick="confirmDelivery('${c.id}')">${icon('send',17,2.2)} Autoriser et confirmer la livraison</button>
  </div>`;
  if(delivery&&!paidOk)return `<div class="card wf-action mt-12" style="border-color:var(--warning)">
    <b>Livraison bloquée : paiement non vérifié</b>
    <p class="hint-sm mt-8">Le programme exige montant, mode, référence, date et contrôle d’encaissement avant toute livraison.</p>
    <button class="btn primary block mt-12" onclick="openPaymentModal('${c.id}')">${icon('money',17,2.2)} Ouvrir le formulaire de paiement</button>
  </div>`;
  return `<div class="card wf-action mt-12">
    <div class="sec-head"><b>Paiement à traiter</b><span class="pill">Obligatoire</span></div>
    <p class="hint-sm mt-8">Montant prévu : ${money(amount)} · Déjà encaissé : ${money(paid)} · Solde : ${money(Math.max(0,amount-paid))}</p>
    <button class="btn primary block mt-12" onclick="openPaymentModal('${c.id}')">${icon('money',17,2.2)} Demander / enregistrer le paiement</button>
  </div>`;
}
function completeCurrentWorkflowStep(id){
  const c=DB.commands.find(x=>x.id===id); if(!c)return; const wf=(DB.workflows[c.service]||DB.workflows.default||[]).filter(Boolean); const cur=Math.max(0,(c.step||1)-1);
  if(cur>=wf.length-1){toast('Dernière étape atteinte.','info');return;}
  c.workflowLog=c.workflowLog||[]; c.workflowLog.push({step:cur+1,label:wf[cur],at:new Date().toISOString(),status:'completed'});
  c.step=cur+2; c.progress=Math.round(((c.step-1)/Math.max(wf.length-1,1))*100);
  const next=workflowKey(wf[c.step-1]);
  if(next==='validation'){c.status='en_validation';} else if(next==='paiement'){c.status='paiement_attente';} else if(next==='livraison'){c.status='en_livraison';} else c.status='en_cours';
  saveDB(); toast(`Étape terminée → ${wf[c.step-1]}`,'success'); render();
}
function validateCommand(id,ok){
  const c=DB.commands.find(x=>x.id===id);if(!c)return;
  const wf=(DB.workflows[c.service]||DB.workflows.default||[]).filter(Boolean);
  const current=Math.max(0,Math.min((c.step||1)-1,wf.length-1));
  const findAfter=(keys)=>{for(let i=current+1;i<wf.length;i++)if(keys.includes(workflowKey(wf[i])))return i;return -1;};
  const idx=ok?(findAfter(['paiement'])>=0?findAfter(['paiement']):Math.min(current+1,wf.length-1)):(findAfter(['corrections'])>=0?findAfter(['corrections']):Math.min(current+1,wf.length-1));
  c.validation=ok?'valide':'non_valide'; c.status=ok?'paiement_attente':'en_correction';
  c.step=idx+1;c.progress=Math.round((idx/Math.max(wf.length-1,1))*100);c.updatedAt=new Date().toISOString();
  saveDB();toast(ok?'Présentation validée → étape suivante':'Non validé → corrections','success');go('workflow',{id:c.id});
}
function openPaymentModal(id){
  const c=DB.commands.find(x=>x.id===id);if(!c)return;
  const balance=Math.max(0,Number(c.amount||0)-Number(c.paid||0));
  const p=c.payment||{};
  const client=clientById(c.client)||{name:'Client'};
  const requestMsg=`Bonjour ${client.name},\n\nVotre ${c.service} est prête à passer à l’étape de paiement.\n\nMontant à régler : ${money(balance)}\nMode de paiement : à confirmer\nRéférence : à renseigner\n\nMerci de nous transmettre la confirmation du paiement afin que nous puissions vérifier l’encaissement et autoriser la livraison.\n\n— Équipe MSN`;
  openModal({
    title:'Paiement — demande et encaissement',
    body:`<div class="commercial mb-12"><b>Avant la livraison</b><p class="hint-sm mt-4">Le paiement doit être renseigné, vérifié et marqué comme prêt. Tant que ces conditions ne sont pas réunies, la livraison reste bloquée.</p></div>
    <div class="field"><label for="pay-amount">Montant à encaisser <span class="req">*</span></label><input class="input" id="pay-amount" type="number" min="0" step="1" value="${Number(p.amount||balance)}"></div>
    <div class="field"><label for="pay-mode">Mode de paiement <span class="req">*</span></label><select class="select" id="pay-mode">
      ${['MVola','Orange Money','Airtel Money','Virement bancaire','Espèces'].map(x=>`<option ${p.mode===x?'selected':''}>${x}</option>`).join('')}
    </select></div>
    <div class="field"><label for="pay-ref">Référence de paiement <span class="req">*</span></label><input class="input" id="pay-ref" value="${esc(p.ref||'')}" placeholder="Ex. MVL-2026-001"></div>
    <div class="field"><label for="pay-date">Date du paiement <span class="req">*</span></label><input class="input" id="pay-date" type="date" value="${p.date||todayStr()}"></div>
    <div class="field"><label for="pay-account">Compte / bénéficiaire contrôlé</label><input class="input" id="pay-account" value="${esc(p.account||'')}" placeholder="Ex. Compte MSN / numéro concerné"></div>
    <div class="field"><label class="check wf-check"><input id="pay-account-ready" type="checkbox" ${p.accountReady?'checked':''} style="margin-top:3px;width:auto"><span><b>Encaissement vérifié et compte prêt</b><small class="hint-sm" style="display:block">Cocher uniquement après contrôle réel du paiement.</small></span></label></div>
    <div class="field"><label for="pay-request-message">Message de demande de paiement</label><textarea class="textarea" id="pay-request-message" style="min-height:130px">${esc(p.requestMessage||requestMsg)}</textarea></div>`,
    footer:`<button class="btn soft grow" onclick="closeModal()">Annuler</button><button class="btn primary grow" onclick="confirmPayment('${id}')">${icon('check',16,2.3)} Enregistrer le paiement</button>`
  });
}
function confirmPayment(id){
  const c=DB.commands.find(x=>x.id===id);
  if(!c){toast('Commande introuvable.','error');return;}
  const amount=Number($('#pay-amount')?.value||0);
  const mode=$('#pay-mode')?.value||'';
  const ref=$('#pay-ref')?.value.trim()||'';
  const date=$('#pay-date')?.value||'';
  const account=$('#pay-account')?.value.trim()||'';
  const ready=!!$('#pay-account-ready')?.checked;
  const requestMessage=$('#pay-request-message')?.value.trim()||'';
  if(amount<=0){toast('Le montant encaissé doit être supérieur à 0.','error');return;}
  if(!mode){toast('Le mode de paiement est obligatoire.','error');return;}
  if(!ref){toast('La référence de paiement est obligatoire.','error');return;}
  if(!date){toast('La date du paiement est obligatoire.','error');return;}
  if(!ready){toast('Le paiement doit être vérifié avant d’autoriser la livraison.','error');return;}
  c.payment={amount,mode,ref,date,account,accountReady:true,requestMessage};
  c.paid=(c.paid||0)+amount;
  c.status='en_livraison';
  const inv=DB.invoices.find(i=>i.client===c.client&&i.service===c.service&&i.status!=='payee');
  if(inv){inv.paid=Math.min(inv.amount,inv.paid+amount);inv.status=inv.paid>=inv.amount?'payee':'partielle';}
  let wf=(DB.workflows[c.service]||DB.workflows.default||[]).filter(Boolean);
  if(!wf.some(x=>workflowKey(x)==='paiement')){const di=wf.findIndex(x=>workflowKey(x)==='livraison');if(di>=0)wf.splice(di,0,'Paiement');else wf.push('Paiement');}
  if(!wf.some(x=>workflowKey(x)==='livraison'))wf.push('Livraison');
  DB.workflows[c.service]=wf;
  const idx=wf.findIndex(x=>workflowKey(x)==='livraison');
  c.step=idx>=0?idx+1:c.step;
  c.progress=Math.round(((c.step-1)/Math.max(wf.length-1,1))*100);
  c.updatedAt=new Date().toISOString();
  DB.activity.unshift({id:'A'+Date.now(),type:'payment',text:`Paiement encaissé — ${c.id} (${money(amount)})`,time:"à l'instant"});
  saveDB();closeModal();toast('Paiement vérifié → livraison autorisée','success');go('workflow',{id:c.id});
}
function confirmDelivery(id){const c=DB.commands.find(x=>x.id===id);if(!c)return;c.status='termine';c.progress=100;c.deliveredAt=todayStr();saveDB();toast('Livraison confirmée — pensez au message de suivi','success');render();}
function workflowUndoStep(id,targetIndex){const c=DB.commands.find(x=>x.id===id);if(!c)return;const wf=(DB.workflows[c.service]||DB.workflows.default||[]).filter(Boolean);if(targetIndex<0||targetIndex>=wf.length||targetIndex>=c.step-1){toast('Cette étape n’est pas encore accomplie.','info');return;}if(['en_livraison','termine'].includes(c.status)){toast('Retour arrière bloqué après livraison.','error');return;}openModal({title:'Revenir à cette étape ?',body:`<p>Le dossier reviendra à <b>${esc(wf[targetIndex])}</b>.</p><p class="hint-sm mt-8">Les étapes suivantes seront à refaire, sans supprimer les données déjà enregistrées.</p>`,footer:`<button class="btn soft grow" onclick="closeModal()">Garder</button><button class="btn danger grow" onclick="closeModal();confirmWorkflowUndo('${id}',${targetIndex})">Revenir</button>`});}
function confirmWorkflowUndo(id,targetIndex){const c=DB.commands.find(x=>x.id===id);if(!c)return;const wf=(DB.workflows[c.service]||DB.workflows.default||[]).filter(Boolean);c.step=targetIndex+1;c.progress=Math.round((targetIndex/Math.max(wf.length-1,1))*100);c.status='en_cours';if(c.validation)delete c.validation;saveDB();toast(`Retour à « ${wf[targetIndex]} »`,'info');render();}
function workflowJump(id,target){const c=DB.commands.find(x=>x.id===id);if(!c)return;const wf=(DB.workflows[c.service]||DB.workflows.default||[]).filter(Boolean);if(target>=(c.step||1)){toast('Cette étape n’est pas encore accessible.','info');return;}if(target<((c.step||1)-1)){workflowUndoStep(id,target);return;}render();}
function sendWorkflowMessage(id){const c=DB.commands.find(x=>x.id===id);if(!c)return;const cl=clientById(c.client)||{name:'Client'};const wf=(DB.workflows[c.service]||DB.workflows.default||[]).filter(Boolean);const rule=currentWorkflowRule(wf[Math.max(0,(c.step||1)-1)]);copyText(workflowMessageFor(c,cl,rule));toast(`Message copié pour ${cl.name}`);}

SCREENS.workflow = (params={}) => {
  const id=typeof params==='string'?params:params.id;
  const c=DB.commands.find(x=>x.id===id);
  if(!c)return `${appbar('Workflow',{back:true})}<div class="pad pad-y">${emptyState('alert','Commande introuvable','Sélectionnez une commande valide.',`<button class="btn primary block" onclick="go('commands')">Voir les commandes</button>`)}</div>`;
  const baseWf=(DB.workflows[c.service]||DB.workflows.default||[]).filter(Boolean);
  const wf=baseWf.slice();
  if(!wf.some(x=>workflowKey(x)==='paiement')){
    const di=wf.findIndex(x=>workflowKey(x)==='livraison');
    if(di>=0) wf.splice(di,0,'Paiement');
    else wf.push('Paiement');
  }
  if(!wf.some(x=>workflowKey(x)==='livraison')) wf.push('Livraison');
  DB.workflows[c.service]=wf;
  if(!wf.length)return `${appbar('Workflow',{back:true})}<div class="pad pad-y">${emptyState('alert','Workflow non configuré','Aucune étape n’est configurée pour ce service.',`<button class="btn primary block" onclick="go('commands')">Retour aux commandes</button>`)}</div>`;
  const cur=Math.max(0,Math.min((c.step||1)-1,wf.length-1)),cl=clientById(c.client)||{id:'unknown',name:'Client'};
  const rule=currentWorkflowRule(wf[cur]);
  const insight=workflowInsight(c,cl);
  const terminal=['en_livraison','termine'].includes(c.status);
  const stepNav=wf.map((st,i)=>`<button class="wf-step ${i<cur?'done':''} ${i===cur?'current':''}" aria-current="${i===cur?'step':'false'}" onclick="${i<=cur&&!terminal?`workflowJump('${c.id}',${i})`:`toast('Cette étape sera accessible après son passage.','info')`}"><span class="wf-circle" aria-hidden="true">${i<cur?'✓':i+1}</span><span class="wf-step-label">${esc(st)}</span></button>`).join('');
  return `${appbar('Workflow',{sub:c.service,back:true,right:`<span class="pill">${c.progress||0}%</span>`})}<div class="scroll"><div class="pad pad-y">
    <div class="wf-steps">${stepNav}</div>
    <div class="wf-hero">
      <div class="row-between">
        <div class="grow"><span class="wf-kicker">Étape actuelle</span><div class="wf-step-name">${esc(wf[cur])}</div></div>
        <span class="wf-state">${c.status==='termine'?'Terminée':'En cours'}</span>
      </div>
      <div class="progress mt-12"><i style="width:${Math.max(0,Math.min(100,c.progress||0))}%"></i></div>
      <div class="row mt-12" style="gap:10px">
        <div class="avatar sm" style="background:${avatarColor(cl.id)}" aria-hidden="true">${initials(cl.name)}</div>
        <div class="grow" style="font-size:12.5px"><b>${esc(cl.name)}</b><div class="hint-sm">${esc(c.id)} · ${esc(c.channel||'Client')} · ${deadlineLabel(c.deadline)}</div></div>
        <button class="btn xs soft" onclick="go('command-detail',{id:'${c.id}'})">Fiche</button>
      </div>
    </div>
    ${journeyStrip(c)}
    <details class="guide mt-12">
      <summary>${icon('flow',16,2)} Guide de l’étape — objectif, politique, consigne <span class="g-chev" aria-hidden="true">${icon('chev',15,2.4)}</span></summary>
      <div class="guide-body">
        <p><b>Objectif :</b> ${esc(rule.goal)}</p>
        <p><b>Politique :</b> ${esc(rule.policy)}</p>
        <p><b>Consigne :</b> ${esc(rule.action)}</p>
      </div>
    </details>
    ${insight?`<div class="insight ${insight.kind||''} mt-12"><b>${esc(insight.title)}</b><p class="hint-sm" style="margin:5px 0 10px">${esc(insight.text)}</p><div class="message-box">${esc(insight.message)}</div><div class="workflow-actions mt-10"><button class="btn soft" onclick="copyText(${JSON.stringify(insight.message).replace(/"/g,'&quot;')})">${icon('copy',15,2.2)} Copier</button><button class="btn primary" onclick="sendWorkflowMessage('${c.id}')">${icon('send',15,2.2)} Préparer l'envoi</button></div></div>`:''}
    ${workflowActionPanel(c,cl,rule,wf,cur)}
    <div class="row mt-12" style="gap:8px"><button class="btn soft grow" onclick="workflowJump('${c.id}',${Math.max(0,cur-1)})" ${cur===0?'disabled':''}>${icon('back',15,2.2)} Étape précédente</button>${cur>0&&!terminal?`<button class="btn soft grow" onclick="workflowUndoStep('${c.id}',${cur-1})">Revenir / corriger</button>`:''}</div>
  </div></div>`;
};

/* Timeline unifiée : réceptions + commandes + devis + factures du client */
function renderClientJourney(c,{receptions,cmds,quotes,invoices}){
  const events=[];
  receptions.forEach(r=>events.push({date:r.at?.slice(0,10)||todayStr(),time:r.at,label:'Réception',icon:'door',state:'done',text:`Accueil par ${r.channel||'canal direct'} — ${r.service||'service à qualifier'}`,badge:STATUS[r.status]?.l||'Qualifiée',badgeClass:STATUS[r.status]?.c||'b-info'}));
  quotes.forEach(q=>events.push({date:q.date,label:'Devis',icon:'file',state:q.status==='accepte'?'done':'current',text:`${q.id} — ${q.service} · ${money(q.amount)}`,badge:STATUS[q.status]?.l||q.status,badgeClass:STATUS[q.status]?.c||'b-muted',link:`go('quote-detail',{id:'${q.id}'})`}));
  cmds.forEach(cmd=>{
    events.push({date:cmd.created,label:'Commande',icon:'orders',state:cmd.status==='termine'?'done':'current',text:`${cmd.id} — ${cmd.service} · ${money(cmd.amount)}`,badge:STATUS[cmd.status]?.l||cmd.status,badgeClass:STATUS[cmd.status]?.c||'b-primary',link:`go('command-detail',{id:'${cmd.id}'})`});
    if(cmd.presentation?.sentAt)events.push({date:cmd.presentation.sentAt.slice(0,10),label:'Présentation',icon:'present',state:cmd.validation==='valide'?'done':'current',text:`${cmd.id} — présentation envoyée au client`,badge:cmd.validation==='valide'?'Validée':'En attente',badgeClass:cmd.validation==='valide'?'b-success':'b-info',link:`go('workflow',{id:'${cmd.id}'})`});
    if(cmd.deliveredAt)events.push({date:cmd.deliveredAt,label:'Livraison',icon:'send',state:'done',text:`${cmd.id} — prestation livrée`,badge:'Livrée',badgeClass:'b-success'});
    if(cmd.followupAt)events.push({date:cmd.followupAt,label:'Suivi',icon:'heart',state:'done',text:`${cmd.id} — remerciement envoyé`,badge:'Fait',badgeClass:'b-success'});
  });
  invoices.forEach(i=>events.push({date:i.date,label:'Facture',icon:'money',state:i.status==='payee'?'done':'current',text:`${i.id} — ${money(i.amount)}${i.paid?` (payé ${money(i.paid)})`:''}`,badge:STATUS[i.status]?.l||i.status,badgeClass:STATUS[i.status]?.c||'b-warn',link:`go('invoice-detail',{id:'${i.id}'})`}));
  events.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(!events.length) return emptyState('flow','Aucun parcours','Ce client n’a pas encore d’historique. Commencez par une réception.',`<button class="btn primary" onclick="go('reception')">${icon('door',17,2.2)} Accueillir ce client</button>`);
  return `<div class="card"><div class="sec-head"><h2 style="font-size:14px">Historique de traitement lié</h2><span class="pill">${events.length} évts</span></div>
  <div class="timeline">
    ${events.map(e=>`<div class="tl-item ${e.state==='done'?'done':'current'}">
      <div class="tl-dot" aria-hidden="true">${icon(e.icon,11,2.3)}</div>
      <div class="tl-head"><span class="tl-title">${esc(e.label)}</span><span class="badge ${e.badgeClass}" style="height:20px;font-size:10.5px">${esc(e.badge)}</span></div>
      <div class="tl-meta">${esc(e.text)}${e.date?` · ${dateFr(e.date)}`:''}</div>
      ${e.link?`<button class="tl-link" onclick="${e.link}">${icon('chev',12,2.4)} Ouvrir</button>`:''}
    </div>`).join('')}
  </div></div>`;
}

function quickAddServiceLine(name){
  if(!name)return; const s=DB.services.find(x=>x.name===name); if(!s)return;
  const wrap=document.getElementById('q-lines'); const existing=[...wrap.querySelectorAll('.quote-line')].find(x=>x.dataset.service===name);
  if(existing){existing.querySelector('[data-l="q"]').value=Number(existing.querySelector('[data-l="q"]').value||1)+1;recalcQuote('q');return;}
  const el=document.createElement('div');el.className='card quote-line';el.dataset.service=name;el.style.padding='12px';
  el.innerHTML=`<div class="row-between"><div class="grow"><b>${esc(s.name)}</b><div class="hint-sm">${esc(s.cat)} · ${s.base?money(s.base)+' / '+esc(s.unit):'Sur devis'}</div></div><button class="icon-btn" style="width:34px;height:34px" onclick="this.closest('.quote-line').remove();recalcQuote('q')" aria-label="Retirer la ligne">${icon('trash',14,2.2)}</button></div><input class="input mt-8" data-l="d" value="${esc(s.name)}" aria-label="Description"><div class="row mt-8" style="gap:8px"><input class="input" type="number" min="1" value="1" data-l="q" oninput="recalcQuote('q')" style="flex:0 0 80px" aria-label="Quantité"><input class="input" type="number" min="0" value="${s.base||0}" data-l="pu" oninput="recalcQuote('q')" aria-label="Prix unitaire"></div>`;
  wrap.appendChild(el); recalcQuote('q');
}
function addQuoteLine(prefix){
  const wrap=document.getElementById(prefix+'-lines');const el=document.createElement('div');el.className='card quote-line';el.style.padding='12px';
  el.innerHTML=`<div class="row-between mb-8"><b>Ligne personnalisée</b><button class="icon-btn" style="width:34px;height:34px" onclick="this.closest('.quote-line').remove();recalcQuote('${prefix}')" aria-label="Retirer la ligne">${icon('trash',14,2.2)}</button></div><input class="input" placeholder="Description" data-l="d" aria-label="Description"><div class="row mt-8" style="gap:8px"><input class="input" type="number" min="1" value="1" data-l="q" oninput="recalcQuote('${prefix}')" aria-label="Quantité"><input class="input" type="number" min="0" value="0" data-l="pu" oninput="recalcQuote('${prefix}')" aria-label="Prix unitaire"></div>`;wrap.appendChild(el);
}
function pickSegment(btn,val){btn.parentElement.querySelectorAll('button').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false');});btn.classList.add('on');btn.setAttribute('aria-pressed','true');const x=$('#q-deposit-custom');if(x)x.style.display=val==='custom'?'block':'none';}
function recalcQuote(prefix){const lines=document.querySelectorAll('#'+prefix+'-lines .quote-line'),sub=[...lines].reduce((s,l)=>(s+(parseFloat(l.querySelector('[data-l="q"]').value)||0)*(parseFloat(l.querySelector('[data-l="pu"]').value)||0)),0),disc=parseFloat($('#'+prefix+'-discount')?.value)||0,da=sub*disc/100,total=Math.max(0,Math.round(sub-da));if($('#q-sub'))$('#q-sub').textContent=money(sub);if($('#q-disc'))$('#q-disc').textContent='— '+money(da);if($('#q-total'))$('#q-total').textContent=money(total);const dep=$('#q-deposit .on')?.textContent||'Aucun';if($('#q-deposit-preview'))$('#q-deposit-preview').textContent=dep==='Personnalisé'?(($('#q-deposit-custom')?.value||0)+' % d’acompte'):(dep==='Aucun'?'Aucun acompte':dep+' d’acompte');return total;}
function saveQuote(){
  const client=$('#q-client').value,service=$('#q-service').value||document.querySelector('#q-lines .quote-line')?.dataset.service;
  if(!client||!service){toast('Client et au moins une prestation requis','error');return;}
  const lines=[...document.querySelectorAll('#q-lines .quote-line')].map(l=>({d:l.querySelector('[data-l="d"]').value.trim()||'Prestation',q:Number(l.querySelector('[data-l="q"]').value)||0,pu:Number(l.querySelector('[data-l="pu"]').value)||0})).filter(l=>l.q>0&&l.pu>=0);
  if(!lines.length){toast('Ajoutez au moins une ligne tarifée','error');return;}
  const sub=lines.reduce((a,l)=>a+l.q*l.pu,0),disc=Number($('#q-discount').value)||0,total=Math.round(sub*(1-disc/100)),validity=Number($('#q-validity').value)||14;
  const vd=new Date();vd.setDate(vd.getDate()+validity);
  const id='DEV-'+(2406+DB.quotes.length);
  DB.quotes.unshift({id,client,service,status:'brouillon',date:todayStr(),valid:vd.toISOString().slice(0,10),amount:total,lines,note:$('#q-note')?.value.trim()||''});
  DB.activity.unshift({id:'A'+Date.now(),type:'quote',text:`Devis ${id} créé — ${clientById(client).name}`,time:"à l'instant"});
  saveDB();toast('Devis créé — prêt à être envoyé','success');go('quote-detail',{id});
}

function saveAccountSecurity(id){
  let u=(DB.users||[]).find(x=>x.id===id)||DB.users?.find(x=>x.username===SESSION?.username);if(!u){toast('Compte introuvable','error');return;}
  const p1=$('#account-new-pass')?.value||'',p2=$('#account-new-pass2')?.value||'';
  if(p1&&(p1.length<8||p1!==p2)){toast(p1.length<8?'Mot de passe trop court':'Les mots de passe ne correspondent pas','error');return;}
  if(p1)u.password=p1;
  u.permissions=[...document.querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value).filter(x=>['dashboard','reception','commands','workflow','documents','payments','clients','portfolio','presentations','administration'].includes(x));
  saveDB();closeModal();toast('Paramètres du compte enregistrés','success');
}
function togglePref(k){
  DB.prefs = DB.prefs || {notif:true, sound:false, formats:'PDF'};

  toast('Préférence mise à jour');

}
function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'msn_manager_export.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Export téléchargé');
}

    {l:'Nouvelle tâche',d:'Planifier une action',ic:'task',bg:'var(--accent-soft)',c:'var(--accent-strong)',fn:'openNewTask()'},
  ];
  openModal({
    title:'Nouvelle action',
    body:`<div class="stack" style="gap:8px">
      ${items.map(i=>`
        <button class="priority" onclick="closeModal();setTimeout(()=>{${i.fn}},30)">
          <span class="p-ico" style="background:${i.bg};color:${i.c}" aria-hidden="true">${icon(i.ic,17,2.2)}</span>
          <span class="grow"><span class="p-title" style="display:block">${i.l}</span><span class="p-meta">${i.d}</span></span>
          <span style="color:var(--text-3)" aria-hidden="true">${icon('chev',18,2.2)}</span>
        </button>`).join('')}
    </div>`
  });
}

/* ============================================================
   MODALES MÉTIER
   ============================================================ */
function openNewClient(){
  openModal({
    title:'Nouveau client',
    body:`
      <div class="field"><label for="nc-name">Nom complet <span class="req">*</span></label><input class="input" id="nc-name" placeholder="Ex. Jean Rakoto" autocomplete="name"></div>
      <div class="field"><label for="nc-phone">Téléphone <span class="req">*</span></label><input class="input" id="nc-phone" type="tel" placeholder="+261 …"></div>
      <div class="field"><label for="nc-email">Email</label><input class="input" type="email" id="nc-email" placeholder="client@exemple.mg" autocomplete="email"></div>
      <div class="field"><label for="nc-city">Ville</label><input class="input" id="nc-city" placeholder="Antananarivo"></div>
      <div class="field"><label for="nc-notes">Notes</label><textarea class="textarea" id="nc-notes" placeholder="Préférences, informations utiles…" style="min-height:70px"></textarea></div>`,
    footer:`<button class="btn soft grow" onclick="closeModal()">Annuler</button><button class="btn primary grow" onclick="createClient()">Créer</button>`
  });
}
function createClient(){
  const name = document.getElementById('nc-name').value.trim();
  const phone = document.getElementById('nc-phone').value.trim();
  if(!name || !phone){ toast('Nom et téléphone requis','error'); return; }
  const id = 'CL-'+String(DB.clients.length+1).padStart(3,'0');
  DB.clients.push({
    id, name, phone,
    email: document.getElementById('nc-email').value,
    city: document.getElementById('nc-city').value || '—',
    notes: document.getElementById('nc-notes').value,
    orders:0, total:0, last:todayStr(), created:todayStr()
  });
  DB.activity.unshift({id:'A'+Date.now(),type:'client',text:`Client ${name} ajouté`,time:"à l'instant"});
  saveDB();
  closeModal();
  toast('Client ajouté');
  render();
}
function openNewInvoice(){
  openModal({title:'Nouvelle facture',body:`
    <div class="commercial"><b>Créer une facture à partir d’un devis ou du catalogue</b><div class="hint-sm mt-4">Les lignes et tarifs peuvent être ajustés avant émission.</div></div>
    <div class="field mt-12"><label for="ni-quote">Devis source</label><select class="select" id="ni-quote" onchange="loadInvoiceFromQuote(this.value)"><option value="">Aucune — facture libre</option>${DB.quotes.filter(q=>q.status!=='refuse').map(q=>`<option value="${q.id}">${q.id} — ${esc(clientById(q.client).name)} — ${money(q.amount)}</option>`).join('')}</select></div>
    <div class="field"><label for="ni-client">Client <span class="req">*</span></label><select class="select" id="ni-client"><option value="">Sélectionner…</option>${DB.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="ni-service">Service</label><select class="select" id="ni-service">${DB.services.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}</select></div>
    <div class="field"><span class="field-label">Lignes</span><div id="ni-lines" class="stack" style="gap:8px"><div class="card invoice-line" style="padding:10px"><input class="input" data-l="d" placeholder="Prestation" aria-label="Prestation"><div class="row mt-8" style="gap:8px"><input class="input" type="number" data-l="q" value="1" aria-label="Quantité"><input class="input" type="number" data-l="pu" value="0" aria-label="Prix unitaire"></div></div></div><button class="btn soft block mt-8" onclick="addInvoiceLine()">${icon('plus',15,2.2)} Ajouter une ligne</button></div>
    <div class="field"><label for="ni-due">Échéance</label><input class="input" type="date" id="ni-due" value="${addDays(14)}"></div>
    <div class="field"><label for="ni-conditions">Conditions de paiement</label><textarea class="textarea" id="ni-conditions" style="min-height:70px">Le solde est à régler avant la livraison finale des fichiers exploitables.</textarea></div>
    <div class="card sage"><div class="row-between"><b>Total</b><b id="ni-total" style="font-size:18px;color:var(--primary-strong)">0 Ar</b></div></div>`,footer:`<button class="btn soft grow" onclick="closeModal()">Annuler</button><button class="btn primary grow" onclick="createInvoice()">${icon('check',16,2.3)} Émettre la facture</button>`});
}
function loadInvoiceFromQuote(id){const q=DB.quotes.find(x=>x.id===id);if(!q)return;$('#ni-client').value=q.client;$('#ni-service').value=q.service;const w=$('#ni-lines');w.innerHTML='';q.lines.forEach(l=>addInvoiceLine(l.d,l.q,l.pu));invoiceRecalc();}
function addInvoiceLine(d='',q=1,pu=0){const w=$('#ni-lines');if(!w)return;const el=document.createElement('div');el.className='card invoice-line';el.style.padding='10px';el.innerHTML=`<div class="row-between"><input class="input" data-l="d" value="${esc(d)}" placeholder="Prestation" aria-label="Prestation"><button class="icon-btn" style="width:34px;height:34px" onclick="this.closest('.invoice-line').remove();invoiceRecalc()" aria-label="Retirer la ligne">${icon('trash',14,2.2)}</button></div><div class="row mt-8" style="gap:8px"><input class="input" type="number" min="1" data-l="q" value="${q}" oninput="invoiceRecalc()" aria-label="Quantité"><input class="input" type="number" min="0" data-l="pu" value="${pu}" oninput="invoiceRecalc()" aria-label="Prix unitaire"></div>`;w.appendChild(el);invoiceRecalc();}
function invoiceRecalc(){const total=[...document.querySelectorAll('#ni-lines .invoice-line')].reduce((a,l)=>a+(Number(l.querySelector('[data-l="q"]').value)||0)*(Number(l.querySelector('[data-l="pu"]').value)||0),0);if($('#ni-total'))$('#ni-total').textContent=money(total);return total;}
function createInvoice(){const client=$('#ni-client').value;if(!client){toast('Client requis','error');return;}const lines=[...document.querySelectorAll('#ni-lines .invoice-line')].map(l=>({d:l.querySelector('[data-l="d"]').value.trim()||'Prestation',q:Number(l.querySelector('[data-l="q"]').value)||0,pu:Number(l.querySelector('[data-l="pu"]').value)||0})).filter(l=>l.q>0);const amount=lines.reduce((a,l)=>a+l.q*l.pu,0);if(!amount){toast('Ajoutez au moins une ligne avec un montant','error');return;}const id='FAC-'+(2405+DB.invoices.length);DB.invoices.unshift({id,client,service:$('#ni-service').value,status:'impayee',date:todayStr(),due:$('#ni-due').value,amount,paid:0,lines,quote:$('#ni-quote').value||'',conditions:$('#ni-conditions').value.trim()});DB.activity.unshift({id:'A'+Date.now(),type:'invoice',text:`Facture ${id} émise — ${clientById(client).name}`,time:"à l'instant"});saveDB();closeModal();toast('Facture créée','success');go('invoice-detail',{id});}

function openNewTask(){
  openModal({
    title:'Nouvelle tâche',
    body:`
      <div class="field"><label for="nt-title">Intitulé <span class="req">*</span></label><input class="input" id="nt-title" placeholder="Ex. Relancer client"></div>
      <div class="field"><label for="nt-cmd">Commande liée</label><select class="select" id="nt-cmd"><option value="">Aucune</option>${DB.commands.map(c=>`<option value="${c.id}">${c.id} — ${esc(c.service)}</option>`).join('')}</select></div>
      <div class="field"><span class="field-label">Priorité</span><div class="segmented" id="nt-priority" role="radiogroup" aria-label="Priorité"><button onclick="pickUrgency(this,'basse')" aria-pressed="false">Basse</button><button class="on" onclick="pickUrgency(this,'moyenne')" aria-pressed="true">Moyenne</button><button onclick="pickUrgency(this,'haute')" aria-pressed="false">Haute</button></div></div>
      <div class="field"><label for="nt-due">Échéance</label><input class="input" type="date" id="nt-due" value="${todayStr()}"></div>`,
    footer:`<button class="btn soft grow" onclick="closeModal()">Annuler</button><button class="btn primary grow" onclick="createTask()">Créer</button>`
  });
}
function createTask(){
  const title = document.getElementById('nt-title').value.trim();
  if(!title){ toast('Intitulé requis','error'); return; }
  const id = 'T-'+(DB.tasks.length+1).toString().padStart(2,'0');
  DB.tasks.unshift({
    id, title,
    cmd: document.getElementById('nt-cmd').value,
    priority: document.getElementById('nt-priority').dataset.val || 'moyenne',
    due: document.getElementById('nt-due').value,
    status:'todo'
  });
  saveDB();
  closeModal();
  toast('Tâche créée');
  go('tasks');
}

function openSearchModal(context){
  const labels = {clients:'client',commandes:'commande'};
  const label = labels[context] || 'élément';
  openModal({
    title:'Rechercher',
    body:`<div class="field"><label for="search-input">${label[0].toUpperCase()+label.slice(1)}</label><input class="input" id="search-input" placeholder="Nom, numéro, service…" autocomplete="off"></div>`,
    footer:`<button class="btn soft grow" onclick="closeModal()">Annuler</button><button class="btn primary grow" onclick="performSearch('${context}')">Rechercher</button>`,
    onMount:r=>{ const el=r.querySelector('#search-input'); el?.focus(); el?.addEventListener('keydown',e=>{if(e.key==='Enter')performSearch(context);}); }
  });
}
function performSearch(context){
  const q=($('#search-input')?.value||'').trim().toLowerCase();
  closeModal();
  if(!q){toast('Saisissez un terme de recherche','info');return;}
  if(context==='clients'){ const c=DB.clients.find(x=>(x.name+' '+x.phone+' '+(x.email||'')).toLowerCase().includes(q)); if(c){go('client-detail',{id:c.id});return;} }
  if(context==='commandes'){ const c=DB.commands.find(x=>(x.id+' '+x.service+' '+clientById(x.client).name).toLowerCase().includes(q)); if(c){go('command-detail',{id:c.id});return;} }
  toast('Aucun résultat trouvé','info');
}

function openCommandMenu(id){
  const c = DB.commands.find(x=>x.id===id);
  openModal({
    title:'Actions — '+id,
    body:`<div class="stack" style="gap:8px">
      <button class="btn block" onclick="closeModal();go('workflow',{id:'${id}'})">${icon('play',17,2.2)} Ouvrir le workflow</button>
      <button class="btn block" onclick="closeModal();go('command-detail',{id:'${id}'})">${icon('flow',17,2.2)} Voir le parcours lié</button>
      <button class="btn block" onclick="closeModal();pauseCommand('${id}')">${icon('pause',17,2.2)} Mettre en pause</button>
      <button class="btn block" onclick="closeModal();finishCommand('${id}')">${icon('check',17,2.2)} Marquer comme terminée</button>
      <button class="btn block" onclick="closeModal();openGenerateMenu('${id}')">${icon('file',17,2.2)} Générer un document</button>
      <div class="divider"></div>
      <button class="btn danger block" onclick="closeModal();archiveCommand('${id}')">${icon('trash',17,2.2)} Archiver la commande</button>
    </div>`
  });
}
function pauseCommand(id){
  const c = DB.commands.find(x=>x.id===id);
  if(c){ c.status='en_attente'; saveDB(); toast('Commande mise en pause','info'); render(); }
}
function finishCommand(id){
  const c = DB.commands.find(x=>x.id===id);
  if(c){ c.status='termine'; c.progress=100; saveDB(); toast('Commande terminée'); render(); }
}
function archiveCommand(id){
  confirmDialog('Archiver la commande ?','Elle ne sera plus visible dans les filtres actifs.',()=>{
    const c = DB.commands.find(x=>x.id===id);
    if(c){ c.status='annule'; saveDB(); toast('Commande archivée'); go('commands'); }
  });
}
function openGenerateMenu(id){
  const formats = [
    {l:'Devis',d:'Proposition commerciale',ic:'file',bg:'var(--primary-soft)',c:'var(--primary-strong)',type:'quote'},
    {l:'Facture',d:'Document de facturation',ic:'money',bg:'var(--danger-soft)',c:'var(--danger-text)',type:'invoice'},
    {l:'Contrat',d:'Conditions et délais',ic:'docs',bg:'var(--success-soft)',c:'var(--success-text)',type:'contract'},
    {l:'Message client',d:'Message prêt à envoyer',ic:'msg',bg:'var(--info-soft)',c:'var(--info-text)',type:'message'},
  ];
  openModal({
    title:'Générer un document',
    body:`<div class="stack" style="gap:8px">
      ${formats.map(f=>`
        <button class="priority" onclick="closeModal();chooseFormat('${f.type}','${f.l}','${id}')">
          <span class="p-ico" style="background:${f.bg};color:${f.c}" aria-hidden="true">${icon(f.ic,17,2.2)}</span>
          <span class="grow"><span class="p-title" style="display:block">${f.l}</span><span class="p-meta">${f.d}</span></span>
          <span style="color:var(--text-3)" aria-hidden="true">${icon('chev',18,2.2)}</span>
        </button>`).join('')}
    </div>`
  });
}
function chooseFormat(type,label,id){
  const c=DB.commands.find(x=>x.id===id);
  const cl=clientById(c?.client);
  if(type==='quote'){openModal({title:'Devis — '+cl.name,body:`<div class="message-paper"><div class="message-body">${esc(`Bonjour ${cl.name},\n\nVoici notre proposition pour ${c.service} :\n${money(c.amount)} — délai ${deadlineLabel(c.deadline)}.\n\nSouhaitez-vous que nous lancions la commande ?\n\n— Équipe MSN`)}</div></div>`,footer:`<button class="btn soft grow" onclick="closeModal()">Fermer</button><button class="btn primary grow" onclick="closeModal();go('new-quote')">Créer le devis complet</button>`});return;}
  if(type==='invoice'){closeModal();openNewInvoice();return;}
  if(type==='message'){copyText(`Bonjour ${cl.name},\n\nNous poursuivons votre ${c.service}. ${c.service?'':''}État d'avancement : ${c.progress}% — ${deadlineLabel(c.deadline)}.\n\n— Équipe MSN`);return;}
  openModal({title:'Format — '+label,body:`<div class="hint-sm mb-12">Choisissez le format de sortie du document.</div><div class="stack" style="gap:8px"><button class="priority" onclick="closeModal();toast('Document texte généré')"><span class="p-ico" style="background:var(--primary-soft);color:var(--primary-strong)" aria-hidden="true">${icon('msg',17,2.2)}</span><span class="grow"><span class="p-title" style="display:block">Texte</span><span class="p-meta">Copier-coller rapide</span></span></button><button class="priority" onclick="closeModal();toast('Image générée')"><span class="p-ico" style="background:var(--info-soft);color:var(--info-text)" aria-hidden="true">${icon('img',17,2.2)}</span><span class="grow"><span class="p-title" style="display:block">Image</span><span class="p-meta">Partage réseaux sociaux</span></span></button><button class="priority" onclick="closeModal();toast('PDF généré')"><span class="p-ico" style="background:var(--danger-soft);color:var(--danger-text)" aria-hidden="true">${icon('pdf',17,2.2)}</span><span class="grow"><span class="p-title" style="display:block">PDF</span><span class="p-meta">Document professionnel</span></span></button></div>`});
}
function openShareMenu(id, kind){
  openModal({
    title:'Partager',
    body:`
      <div class="hint-sm mb-12">Choisissez un canal d'envoi pour ${esc(id)}.</div>
      <div class="stack" style="gap:8px">
        <button class="btn block" onclick="closeModal();toast('Partagé via WhatsApp')">${icon('msg',17,2.2)} WhatsApp</button>
        <button class="btn block" onclick="closeModal();toast('Partagé via Messenger')">${icon('msg',17,2.2)} Messenger</button>
        <button class="btn block" onclick="closeModal();toast('Partagé par email')">${icon('send',17,2.2)} Email</button>
        <button class="btn block" onclick="closeModal();toast('Copié dans le presse-papier')">${icon('copy',17,2.2)} Copier le lien</button>
      </div>`
  });
}
function openCommandForClient(id){
  const c=clientById(id);
  state.reception.draft={...(state.reception.draft||{}),clientId:id,name:c.name,phone:c.phone,email:c.email||''};
  go('new-request',{fromReception:true,draft:state.reception.draft});
}
function openQuoteForClient(id){
  go('new-quote',{client:id});
}

/* ---------- PRESSE-PAPIER ---------- */
function copyText(text){
  const t = String(text).replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
  if(navigator.clipboard){
    navigator.clipboard.writeText(t).then(()=>toast('Copié dans le presse-papier')).catch(()=>toast('Copié','info'));
  } else {
    const el = document.createElement('textarea');
    el.value = t; document.body.appendChild(el); el.select();
    try{ document.execCommand('copy'); }catch(e){}
    el.remove(); toast('Copié');
  }
}

/* ============================================================
   BOOT
   ============================================================ */
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
/* Accessibilité clavier pour les éléments [role="button"] non natifs */
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"]:not(button):not(a):not(input)')){
    e.preventDefault(); e.target.click();
  }
});

(function boot(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){document.body.classList.add('reduce-motion');}
  DB.prefs = DB.prefs || {notif:true, sound:false, formats:'PDF',storage:'local',language:'fr'};
  usersList(); saveDB();
  try{SESSION=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');}catch(e){SESSION=null;}
  if(SESSION && !usersList().some(u=>u.id===SESSION.id && u.active!==false)) SESSION=null;
  state.screen='dashboard';state.params={};state.history=[];state.wizardStep=0;state.wizardData={};
  renderAuth(); if(SESSION) render(); else $('#app').innerHTML='';
})();
</script>
